<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tu Móvil - Pasajero</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-dark: #05070a;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffcc00;
            --neon-green: #39ff14;
            --danger: #ff3b30;
            --glass-bg: rgba(10, 16, 26, 0.95);
            --glass-border: rgba(0, 243, 255, 0.3);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }

        body { 
            background: var(--bg-dark); 
            height: 100vh; 
            overflow: hidden; 
            color: #fff; 
        }

        #map-wrapper { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
        }

        #map { 
            width: 100%; 
            height: 100%; 
        }

        /* TARJETA SUPERIOR */
        .top-card {
            position: absolute; 
            top: env(safe-area-inset-top, 16px); 
            left: 16px; 
            right: 16px;
            z-index: 1000; 
            background: var(--glass-bg);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); 
            border-radius: 20px;
            padding: 14px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
        }

        .top-row { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 8px; 
        }

        .btn-sentido-pax {
            background: linear-gradient(135deg, var(--neon-yellow) 0%, #ff9900 100%);
            border: none; 
            padding: 8px 14px; 
            border-radius: 12px;
            font-weight: 900; 
            font-size: 11px; 
            color: #000; 
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3); 
            flex: 1;
        }

        .select-parada {
            flex: 2; 
            width: 100%; 
            background: rgba(0,0,0,0.5); 
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #fff; 
            padding: 8px; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: 800; 
            outline: none;
        }

        .subida-info { 
            font-size: 11px; 
            color: #a0b0c0; 
            margin-bottom: 4px; 
            font-weight: 800; 
        }

        .subida-info span { 
            color: var(--neon-cyan); 
            font-weight: 900; 
        }

        /* TARJETA INFERIOR */
        .bottom-card {
            position: absolute; 
            bottom: env(safe-area-inset-bottom, 20px); 
            left: 16px; 
            right: 16px;
            z-index: 1000; 
            background: var(--glass-bg);
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); 
            border-radius: 24px;
            padding: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .input-nombre {
            width: 100%; 
            background: rgba(0,0,0,0.6); 
            border: 1px solid var(--neon-cyan);
            color: #fff; 
            padding: 10px 14px; 
            border-radius: 12px; 
            font-size: 14px;
            font-weight: 900; 
            margin-bottom: 10px; 
            outline: none;
        }

        .input-nombre::placeholder { 
            color: #5a7a9a; 
            font-weight: 700; 
        }

        .btn-solicitar {
            width: 100%; 
            background: linear-gradient(135deg, var(--neon-cyan) 0%, #0088cc 100%);
            color: #000; 
            border: none; 
            padding: 14px; 
            border-radius: 14px;
            font-size: 15px; 
            font-weight: 900; 
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        /* TARJETA DE VIAJE ACTIVO */
        .card-viaje-activo { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .info-chofer-row { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        .auto-icono { 
            font-size: 32px; 
            background: rgba(255,204,0,0.15); 
            padding: 8px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,204,0,0.3); 
        }

        .chofer-detalles h4 { 
            font-size: 16px; 
            font-weight: 900; 
            color: var(--neon-yellow); 
        }

        .chofer-detalles p { 
            font-size: 12px; 
            font-weight: 800; 
            color: #a0b0c0; 
            margin-top: 2px; 
        }

        .caja-estado-verde {
            background: rgba(57, 255, 20, 0.1); 
            border: 1px solid var(--neon-green);
            border-radius: 16px; 
            padding: 12px; 
            text-align: left;
        }

        .caja-estado-verde h5 { 
            color: var(--neon-green); 
            font-size: 13px; 
            font-weight: 900; 
            margin-bottom: 3px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .caja-estado-verde span { 
            color: #fff; 
            font-size: 12px; 
            font-weight: 800; 
        }

        .detalles-extras-row {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: rgba(0,0,0,0.4); 
            padding: 10px 14px; 
            border-radius: 12px;
            font-size: 12px; 
            font-weight: 800; 
            border: 1px solid rgba(255,255,255,0.08);
        }

        .detalles-extras-row b { 
            color: var(--neon-yellow); 
            font-weight: 900; 
        }

        .btn-finalizar {
            width: 100%; 
            background: linear-gradient(135deg, var(--danger) 0%, #b30000 100%);
            color: #fff; 
            border: none; 
            padding: 14px; 
            border-radius: 14px;
            font-size: 15px; 
            font-weight: 900; 
            cursor: pointer; 
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.4);
        }

        /* TARJETAS DE FLOTA */
        .coche-card {
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; 
            padding: 10px; 
            margin-bottom: 8px; 
            cursor: pointer;
        }

        .coche-card.seleccionado { 
            border-color: var(--neon-cyan); 
            background: rgba(0,243,255,0.05); 
        }

        .coche-header { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 8px; 
            font-size: 12px; 
        }

        .asientos-row { 
            display: flex; 
            gap: 6px; 
        }

        .asiento-box { 
            flex: 1; 
            padding: 6px; 
            text-align: center; 
            border-radius: 8px; 
            font-size: 11px; 
            font-weight: 900; 
            background: rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.2); 
        }

        .asiento-box.asiento-libre { 
            color: var(--neon-yellow); 
            border-color: var(--neon-yellow); 
            cursor: pointer; 
        }

        .asiento-box.seleccionado { 
            background: var(--neon-yellow); 
            color: #000; 
        }

        .asiento-box.asiento-ocupado { 
            opacity: 0.4; 
        }

        .sin-coches { 
            text-align: center; 
            font-size: 12px; 
            color: #aaa; 
            padding: 10px; 
        }
    </style>
</head>
<body>

    <div id="map-wrapper"><div id="map"></div></div>

    <!-- TARJETA SUPERIOR -->
    <div class="top-card" id="card-superior">
        <div class="top-row">
            <button id="btn-sentido-pax" class="btn-sentido-pax" onclick="cambiarSentidoPasajero()">SENTIDO: IDA</button>
            <select id="destino-select" class="select-parada">
                <option value="">Selecciona tu destino...</option>
            </select>
        </div>
        <div class="subida-info">Tu Parada de Subida: <span id="txt-subida">Obteniendo GPS...</span></div>
    </div>

    <!-- TARJETA INFERIOR -->
    <div class="bottom-card">
        <!-- FORMULARIO DE RESERVA -->
        <div id="form-reserva-container">
            <input type="text" id="nombre-input" class="input-nombre" placeholder="Escribe tu Nombre y Apellido *" autocomplete="name">

            <div id="flota-container"></div>

            <button id="btn-pedir" class="btn-solicitar" onclick="confirmarViajePasajero()" disabled>SELECCIONÁ TU DESTINO</button>
        </div>

        <!-- PANEL DE VIAJE EN CURSO -->
        <div id="panel-estado-viaje" style="display: none;">
            <div class="card-viaje-activo">
                <div class="info-chofer-row">
                    <div class="auto-icono">🚗</div>
                    <div class="chofer-detalles">
                        <h4 id="info-coche-id">Coche --</h4>
                        <p id="info-chofer-nombre">Conductor Oficial</p>
                    </div>
                </div>

                <div class="caja-estado-verde" id="caja-estado-contenedor">
                    <h5 id="viaje-status-texto">🚗 SOLICITUD ENVIADA</h5>
                    <span id="sub-estado-caja">Esperando que el chofer acepte...</span>
                </div>

                <div class="detalles-extras-row">
                    <div>Destino: <b id="info-destino-abordo">--</b></div>
                    <div>Asiento(s): <b id="info-asientos-detalles">--</b></div>
                </div>

                <button id="btn-cancelar" class="btn-finalizar" onclick="finalizarViaje()">FINALIZAR MI VIAJE</button>
            </div>
        </div>
    </div>

    <div id="toast-container" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999;"></div>
    <div id="banner-llegada" style="display:none; position:fixed; bottom:100px; left:20px; right:20px; background:rgba(0,255,0,0.9); color:#000; padding:15px; border-radius:12px; text-align:center; font-weight:bold; z-index:9999;">
        ¡El coche está llegando! Subida en <span id="llegada-timer">30</span>s
    </div>

    <!-- SCRIPTS DE LIBRERÍAS EXTERNAS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- INSERTA TU JAVASCRIPT AQUÍ ABAJO -->
</body>
</html>
