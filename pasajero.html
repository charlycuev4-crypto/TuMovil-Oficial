<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PASAJERO - TuMovil PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; color: #fff; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* TARJETA SUPERIOR DE VIAJE EN CURSO / PRECIO */
        .card-pasajero {
            position: absolute; bottom: 30px; left: 16px; right: 16px; z-index: 1000;
            background: rgba(15, 20, 30, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 24px;
            padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .header-trip { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .car-info { display: flex; align-items: center; gap: 10px; }
        .car-icon { font-size: 28px; }
        .car-title { font-size: 18px; font-weight: 800; color: #ffcc00; }
        .car-sub { font-size: 11px; color: #aaa; }

        .status-badge {
            background: rgba(52, 199, 89, 0.2); color: #34c759; border: 1px solid #34c759;
            padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 800;
            display: flex; align-items: center; gap: 4px;
        }
        .status-badge .dot { width: 6px; height: 6px; background: #34c759; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .trip-details {
            background: rgba(255,255,255,0.04); border-radius: 16px; padding: 12px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
        }
        .detail-item { display: flex; flex-direction: column; }
        .detail-label { font-size: 9px; color: #888; font-weight: 700; text-transform: uppercase; }
        .detail-value { font-size: 13px; font-weight: 800; color: #fff; margin-top: 2px; }
        
        /* TARIFA DESTACADA $1500 */
        .price-badge {
            background: linear-gradient(135deg, #00d2ff 0%, #0088cc 100%);
            color: #000; padding: 6px 12px; border-radius: 12px; font-weight: 900; font-size: 14px;
            box-shadow: 0 4px 12px rgba(0,210,255,0.3);
        }

        .btn-cancelar {
            width: 100%; background: linear-gradient(135deg, #bd2113 0%, #7a0f05 100%);
            color: #fff; border: 1px solid #ff3b30; padding: 14px; border-radius: 16px;
            font-weight: 800; font-size: 14px; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="card-pasajero" id="card-viaje">
        <div class="header-trip">
            <div class="car-info">
                <span class="car-icon">🚕</span>
                <div>
                    <div class="car-title" id="txt-coche">Coche 1</div>
                    <div class="car-sub" id="txt-chofer">Carlos - Ford Fiesta JCP 478</div>
                </div>
            </div>
            <div class="status-badge">
                <div class="dot"></div>
                <span id="txt-estado">En camino</span>
            </div>
        </div>

        <div class="trip-details">
            <div class="detail-item">
                <span class="detail-label">Destino</span>
                <span class="detail-value" id="txt-destino">Cargando...</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Asiento(s)</span>
                <span class="detail-value" id="txt-asiento">1</span>
            </div>
            <div class="price-badge" id="txt-precio">
                $1500 / asiento
            </div>
        </div>

        <button class="btn-cancelar" onclick="finalizarMiViaje()">FINALIZAR MI VIAJE</button>
    </div>

<script>
    const TARIFA_UNICA = 1500; // Tarifa plana unificada $1500
    const _s = supabase.createClient('https://nvumdlxervrewqiiaicl.supabase.co', 'sb_publishable_oVmiLSfe_AJ5iDpeAXIukA_CLdHuwkE');

    const paradas = [
        {n:'Cruce Erqui / Castelar', c:[-34.549295, -58.783648]},
        {n:'Parque Tecnológico', c:[-34.551586, -58.781403]},
        {n:'Base Aérea', c:[-34.554132, -58.778927]},
        {n:'Miguel Cané', c:[-34.561264, -58.770506]},
        {n:'Cané y Los Aromos', c:[-34.562160, -58.771380]},
        {n:'Los Aromos 11016', c:[-34.562494, -58.772133]},
        {n:'Los Aromos 10874', c:[-34.563541, -58.773244]},
        {n:'Los Aromos y Murillo', c:[-34.564109, -58.773759]},
        {n:'Murillo 601', c:[-34.565342, -58.772061]},
        {n:'Murillo y Güiraldes', c:[-34.567268, -58.769484]},
        {n:'Murillo y Watt', c:[-34.569090, -58.767095]},
        {n:'A. Prado 2555', c:[-34.571016, -58.764443]},
        {n:'Prado y Payró', c:[-34.571956, -58.763201]},
        {n:'Prado 1744', c:[-34.577371, -58.755909]},
        {n:'Boulevard Caveri', c:[-34.578528, -58.757064]},
        {n:'Caveri y Azara', c:[-34.579296, -58.755864]},
        {n:'Caveri y Vedia', c:[-34.580020, -58.755063]},
        {n:'Caveri y Tablada', c:[-34.580901, -58.753842]},
        {n:'Caveri y Echeverría', c:[-34.581998, -58.752441]},
        {n:'Caveri y Gálvez', c:[-34.583319, -58.750710]},
        {n:'Caveri (Final)', c:[-34.584740, -58.748804]},
        {n:'Libertador y Aero', c:[-34.585554, -58.749812]},
        {n:'Libertador 7300', c:[-34.586494, -58.750574]},
        {n:'Libertador 7200', c:[-34.588041, -58.751542]},
        {n:'Libertador y Maza', c:[-34.588273, -58.751338]},
        {n:'Maza y Albatros', c:[-34.588771, -58.750804]},
        {n:'Maternidad', c:[-34.588244, -58.749877]},
        {n:'Abasto y Roca', c:[-34.586030, -58.747278]}
    ];

    const map = L.map('map', { zoomControl: false }).setView(paradas[0].c, 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let markerChofer = null;

    async function monitorearViaje() {
        try {
            const { data: chofer } = await _s.from('estado_movil').select('*').eq('id', 1).single();
            if (chofer && chofer.latitud && chofer.longitud) {
                const pos = [chofer.latitud, chofer.longitud];
                if (!markerChofer) {
                    markerChofer = L.marker(pos).addTo(map);
                } else {
                    markerChofer.setLatLng(pos);
                }
                map.panTo(pos);
            }

            const { data: reserva } = await _s.from('reservas_activas').select('*').eq('id_movil', 1).eq('estado', 'en_curso').limit(1).single();
            if (reserva) {
                document.getElementById('txt-destino').innerText = paradas[reserva.destino_idx] ? paradas[reserva.destino_idx].n : 'Destino';
                document.getElementById('txt-asiento').innerText = reserva.asiento_num;
                document.getElementById('txt-precio').innerText = '$' + TARIFA_UNICA;
                if(reserva.estado_pasajero === 'a_bordo') {
                    document.getElementById('txt-estado').innerText = 'A bordo';
                }
            }
        } catch (e) { console.error(e); }
    }

    async function finalizarMiViaje() {
        if(confirm('¿Deseas finalizar tu viaje?')) {
            await _s.from('reservas_activas').delete().eq('id_movil', 1).eq('estado', 'en_curso');
            alert('Viaje Finalizado. ¡Gracias por viajar con TuMovil!');
            window.location.reload();
        }
    }

    setInterval(monitorearViaje, 3000);
    monitorearViaje();
</script>
</body>
</html>
