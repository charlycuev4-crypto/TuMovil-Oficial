<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PASAJERO - TuMovil PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; color: #fff; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* SPLASH SCREEN */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a3e 0%, #05050f 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999; transition: opacity 0.6s ease, visibility 0.6s;
        }
        #splash .logo-ring {
            width: 110px; height: 110px; border: 3px solid #ffcc00; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.3); animation: pulseRing 2s infinite;
        }
        @keyframes pulseRing { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        #splash h1 { color: #ffcc00; margin-top: 20px; font-size: 24px; letter-spacing: 3px; font-weight: 800; }
        #splash p { color: #888; margin-top: 6px; font-size: 13px; }

        /* PANEL FLOTANTE PASAJERO */
        .panel-pax {
            position: absolute; bottom: env(safe-area-inset-bottom, 16px); left: 16px; right: 16px; z-index: 1000;
            background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 24px;
            padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 12px;
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 10px; font-weight: 800; color: #ffcc00; letter-spacing: 1px; text-transform: uppercase; }
        .input-group input, .input-group select {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; outline: none;
        }
        .input-group select option { background: #111; color: #fff; }

        .btn-reservar {
            background: #ffcc00; color: #000; border: none; padding: 14px; border-radius: 14px;
            font-size: 15px; font-weight: 900; cursor: pointer; transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 15px rgba(255,204,0,0.3);
        }
        .btn-reservar:active { transform: scale(0.98); }

        .estado-reserva {
            background: rgba(0, 210, 255, 0.1); border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 14px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .estado-reserva .info { font-size: 12px; font-weight: 700; color: #00d2ff; }
        .btn-cancelar { background: rgba(255, 59, 48, 0.2); border: 1px solid #ff3b30; color: #ff3b30; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 11px; cursor: pointer; }

        /* TOASTS */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10001; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
        .toast { background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); color: white; padding: 10px 16px; border-radius: 12px; font-size: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); animation: toastIn 0.3s ease; }
        .toast.success { border-color: #34c759; color: #34c759; }
        .toast.warning { border-color: #ffcc00; color: #ffcc00; }
        .toast.error { border-color: #ff3b30; color: #ff3b30; }

        @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* ESTILO MARCADORES Y ETIQUETAS */
        .leaflet-tooltip.etiqueta-pax {
            background: #ffcc00 !important; color: #000000 !important; border: 2px solid #000 !important;
            font-weight: 800 !important; font-size: 11px !important; border-radius: 8px !important;
        }
    </style>
</head>
<body>

    <div id="splash">
        <div class="logo-ring"><span style="font-size: 45px;">🙋‍♂️</span></div>
        <h1>TUMOVIL</h1>
        <p>Pasajero • Solicitud en Tiempo Real</p>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <div id="map"></div>

    <div class="panel-pax" id="panel-pax">
        <div id="sec-formulario">
            <div class="input-group" style="margin-bottom: 8px;">
                <label>Tu Nombre</label>
                <input type="text" id="txt-nombre" placeholder="Ej: Juan Pérez">
            </div>

            <div class="input-group" style="margin-bottom: 8px;">
                <label>Tu Destino</label>
                <select id="select-destino"></select>
            </div>

            <div class="input-group" style="margin-bottom: 12px;">
                <label>Asiento Deseado</label>
                <select id="select-asiento">
                    <option value="1">Asiento 1 (Acompañante)</option>
                    <option value="2">Asiento 2 (Atrás Izq)</option>
                    <option value="3">Asiento 3 (Atrás Centro)</option>
                    <option value="4">Asiento 4 (Atrás Der)</option>
                </select>
            </div>

            <button class="btn-reservar" onclick="solicitarViaje()">SOLICITAR VIAJE ($1500)</button>
        </div>

        <div id="sec-estado" style="display: none;" class="estado-reserva">
            <div class="info" id="txt-estado-info">Buscando conductor...</div>
            <button class="btn-cancelar" onclick="cancelarReserva()">CANCELAR</button>
        </div>
    </div>

<script>
    const TARIFA_UNICA = 1500;
    const MI_ID_MOVIL = 1; // Asignado al Conductor por defecto

    // Lista completa y ordenada de paradas con los nuevos índices sincronizados
    const paradas = [
        {n:'Cruce Erqui / Castelar', c:[-34.549295, -58.783648]},
        {n:'Parque Tecnológico', c:[-34.551586, -58.781403]},
        {n:'Base Aérea', c:[-34.554132, -58.778927]},
        {n:'Miguel Cané', c:[-34.561264, -58.770506]},
        {n:'Cané y Los Aromos', c:[-34.562160, -58.771380]},
        {n:'Los Aromos 11016', c:[-34.562494, -58.772133]},
        {n:'Los Aromos 10874', c:[-34.563541, -58.773244]},
        {n:'Los Aromos y Murillo', c:[-34.564109, -58.773759]},
        {n:'Murillo 601', c:[-34.565342, -58.772061]},
        {n:'Murillo y Güiraldes', c:[-34.567268, -58.769484]},
        {n:'Murillo y Watt', c:[-34.569090, -58.767095]},
        {n:'A. Prado 2555', c:[-34.571016, -58.764443]},
        {n:'Prado y Payró', c:[-34.571956, -58.763201]},
        {n:'Prado 1744', c:[-34.577371, -58.755909]},
        {n:'Boulevard Caveri', c:[-34.578528, -58.757064]},
        {n:'Caveri y Azara', c:[-34.579296, -58.755864]},
        {n:'Caveri y Vedia', c:[-34.580020, -58.755063]},
        {n:'Caveri y Tablada', c:[-34.580901, -58.753842]},
        {n:'Caveri y Echeverría', c:[-34.581998, -58.752441]},
        {n:'Caveri y Gálvez', c:[-34.583319, -58.750710]},
        {n:'Caveri (Final)', c:[-34.584740, -58.748804]},
        {n:'Libertador y Aero', c:[-34.585554, -58.749812]},
        {n:'Libertador 7300', c:[-34.586494, -58.750574]},
        {n:'Libertador 7200', c:[-34.588041, -58.751542]},
        {n:'Libertador y Maza', c:[-34.588273, -58.751338]},
        {n:'Maza y Albatros', c:[-34.588771, -58.750804]},
        {n:'Maternidad', c:[-34.588244, -58.749877]},
        {n:'Abasto y Roca', c:[-34.586030, -58.747278]}
    ];

    const _s = supabase.createClient('https://nvumdlxervrewqiiaicl.supabase.co', 'sb_publishable_oVmiLSfe_AJ5iDpeAXIukA_CLdHuwkE');

    let miPosicion = null;
    let miReservaId = null;
    let markerAuto = null;
    let markerMiUbicacion = null;

    const map = L.map('map', { zoomControl: false }).setView(paradas[0].c, 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { keepBuffer: 8 }).addTo(map);

    // Cargar selector de paradas
    const selectDestino = document.getElementById('select-destino');
    paradas.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = (idx + 1) + ". " + p.n;
        selectDestino.appendChild(opt);
    });

    // Trazar línea de ruta
    L.polyline(paradas.map(p => p.c), { color: '#00d2ff', weight: 4, opacity: 0.5, dashArray: '6, 6' }).addTo(map);

    function mostrarToast(mensaje, tipo) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast ' + tipo;
        toast.textContent = mensaje;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function obtenerUbicacionGPS() {
        if ('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition((pos) => {
                miPosicion = [pos.coords.latitude, pos.coords.longitude];
                if (!markerMiUbicacion) {
                    markerMiUbicacion = L.circleMarker(miPosicion, { radius: 8, color: '#fff', weight: 3, fillColor: '#00d2ff', fillOpacity: 1 }).addTo(map);
                    markerMiUbicacion.bindTooltip("Tu Ubicación", { permanent: true, direction: 'bottom' });
                } else {
                    markerMiUbicacion.setLatLng(miPosicion);
                }
            }, (err) => {
                console.warn("GPS no activado o denegado.");
            }, { enableHighAccuracy: true });
        }
    }

    async function solicitarViaje() {
        const nombre = document.getElementById('txt-nombre').value.trim();
        const destinoIdx = parseInt(selectDestino.value);
        const asientoNum = parseInt(document.getElementById('select-asiento').value);

        if (!nombre) {
            mostrarToast('Por favor, ingresa tu nombre', 'warning');
            return;
        }

        const lat = miPosicion ? miPosicion[0] : paradas[0].c[0];
        const lon = miPosicion ? miPosicion[1] : paradas[0].c[1];

        try {
            const { data, error } = await _s.from('reservas_activas').insert({
                id_movil: MI_ID_MOVIL,
                nombre_pasajero: nombre,
                asiento_num: asientoNum,
                destino_idx: destinoIdx,
                pasajero_lat: lat,
                pasajero_lon: lon,
                estado: 'en_curso',
                estado_pasajero: 'esperando',
                fecha: new Date().toISOString()
            }).select();

            if (error) throw error;

            if (data && data.length > 0) {
                miReservaId = data[0].id;
                localStorage.setItem('pax_reserva_id', miReservaId);
                actualizarInterfazReserva(true, "Esperando al conductor...");
                mostrarToast('¡Solicitud enviada!', 'success');
            }
        } catch (err) {
            mostrarToast('El asiento está ocupado o hubo un error', 'error');
        }
    }

    async function cancelarReserva() {
        if (!miReservaId) return;
        try {
            await _s.from('reservas_activas').update({ estado: 'finalizado' }).eq('id', miReservaId);
            await _s.from('reservas_activas').delete().eq('id', miReservaId);
            localStorage.removeItem('pax_reserva_id');
            miReservaId = null;
            actualizarInterfazReserva(false);
            mostrarToast('Viaje cancelado', 'warning');
        } catch (err) {
            mostrarToast('Error al cancelar', 'error');
        }
    }

    function actualizarInterfazReserva(tieneReserva, textoEstado = "") {
        document.getElementById('sec-formulario').style.display = tieneReserva ? 'none' : 'block';
        document.getElementById('sec-estado').style.display = tieneReserva ? 'flex' : 'none';
        if (textoEstado) document.getElementById('txt-estado-info').innerText = textoEstado;
    }

    async function rastrearVehiculoYReserva() {
        try {
            // 1. Rastrear Coche Conductor
            const { data: movil } = await _s.from('estado_movil').select('*').eq('id', MI_ID_MOVIL).single();
            if (movil && movil.esta_online) {
                const autoPos = [movil.latitud, movil.longitud];
                if (!markerAuto) {
                    markerAuto = L.marker(autoPos).addTo(map);
                    markerAuto.bindTooltip("🚕 " + movil.chofer, { permanent: true, direction: 'top', className: 'etiqueta-pax' });
                } else {
                    markerAuto.setLatLng(autoPos);
                }
            } else if (markerAuto) {
                map.removeLayer(markerAuto);
                markerAuto = null;
            }

            // 2. Verificar estado de la reserva del usuario
            if (miReservaId) {
                const { data: res } = await _s.from('reservas_activas').select('*').eq('id', miReservaId).single();
                if (!res || res.estado !== 'en_curso') {
                    // Si ya fue completado o eliminado por el chofer
                    miReservaId = null;
                    localStorage.removeItem('pax_reserva_id');
                    actualizarInterfazReserva(false);
                    mostrarToast('Viaje Finalizado. ¡Gracias por viajar!', 'success');
                } else {
                    if (res.estado_pasajero === 'a_bordo') {
                        actualizarInterfazReserva(true, "🚘 En viaje hacia tu destino...");
                    } else {
                        actualizarInterfazReserva(true, "⏳ Conductor en camino...");
                    }
                }
            }
        } catch (e) { console.error("Error al actualizar:", e); }
    }

    window.addEventListener('DOMContentLoaded', () => {
        obtenerUbicacionGPS();
        const resGuardada = localStorage.getItem('pax_reserva_id');
        if (resGuardada) {
            miReservaId = resGuardada;
            actualizarInterfazReserva(true, "Verificando viaje...");
        }
    });

    setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) { splash.style.opacity = '0'; setTimeout(() => splash.style.visibility = 'hidden', 600); }
    }, 1500);

    setInterval(rastrearVehiculoYReserva, 3500);
    setInterval(obtenerUbicacionGPS, 10000);
</script>
</body>
</html>
