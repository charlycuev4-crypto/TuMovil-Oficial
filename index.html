<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tu Móvil - Pasajero</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-dark: #05070a;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffcc00;
            --neon-green: #39ff14;
            --glass-bg: rgba(10, 16, 26, 0.90);
            --glass-border: rgba(0, 243, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); height: 100vh; overflow: hidden; color: #fff; }

        #map-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #map { width: 100%; height: 100%; }

        /* TARJETA SUPERIOR */
        .top-card {
            position: absolute; top: env(safe-area-inset-top, 16px); left: 16px; right: 16px;
            z-index: 1000; background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.7);
        }
        
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .top-card label { font-size: 11px; font-weight: 800; color: var(--neon-cyan); letter-spacing: 1px; text-transform: uppercase; }
        
        .btn-sentido-pax {
            background: linear-gradient(135deg, var(--neon-yellow) 0%, #ff9900 100%);
            border: none; padding: 6px 14px; border-radius: 12px;
            font-weight: 900; font-size: 11px; color: #000; cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3); transition: transform 0.2s;
        }
        .btn-sentido-pax:active { transform: scale(0.94); }

        .subida-info { font-size: 11px; color: #a0b0c0; margin-bottom: 6px; font-weight: 700; }
        .subida-info span { color: var(--neon-cyan); }

        .select-parada {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(0, 243, 255, 0.3);
            color: #fff; padding: 10px; border-radius: 12px; font-size: 13px; outline: none;
        }

        /* POPUP MAPA */
        .leaflet-popup-content-wrapper {
            background: rgba(10, 16, 26, 0.95) !important;
            border: 1px solid var(--neon-cyan) !important;
            color: #fff !important; border-radius: 16px !important;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3) !important;
        }
        .leaflet-popup-tip { background: rgba(10, 16, 26, 0.95) !important; }
        
        .popup-content { text-align: center; padding: 4px; }
        .popup-title { font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .btn-popup-select {
            background: linear-gradient(135deg, var(--neon-green) 0%, #208d13 100%);
            color: #000; border: none; padding: 8px 14px; border-radius: 10px;
            font-weight: 900; font-size: 12px; cursor: pointer; width: 100%;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
        }

        /* PANEL INFERIOR */
        .bottom-card {
            position: absolute; bottom: env(safe-area-inset-bottom, 20px); left: 16px; right: 16px;
            z-index: 1000; background: var(--glass-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .input-nombre {
            width: 100%; background: rgba(0,0,0,0.6); border: 1px solid var(--neon-cyan);
            color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 14px;
            font-weight: 700; margin-bottom: 10px; outline: none;
        }
        .input-nombre::placeholder { color: #5a7a9a; }

        .destino-info { margin-bottom: 10px; }
        .destino-label { font-size: 10px; color: #8a99ad; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .destino-nombre { font-size: 14px; font-weight: 900; color: var(--neon-yellow); margin-top: 2px; }

        .selector-asientos { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .asientos-btn-group { display: flex; gap: 8px; }
        
        /* Botones de asientos independientes y limpios */
        .btn-seat {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; width: 36px; height: 36px; border-radius: 10px;
            font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .btn-seat.selected {
            background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .btn-solicitar {
            width: 100%; background: linear-gradient(135deg, var(--neon-cyan) 0%, #0088cc 100%);
            color: #000; border: none; padding: 14px; border-radius: 14px;
            font-size: 15px; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); transition: transform 0.2s;
        }
        .btn-solicitar:active { transform: scale(0.97); }

        /* PANEL DE ESTADO EN VIVO */
        #panel-estado-viaje {
            display: none; text-align: center; padding: 4px;
        }
        #panel-estado-viaje h3 { color: var(--neon-green); font-size: 15px; font-weight: 900; margin-bottom: 6px; }
        #panel-estado-viaje p { font-size: 13px; font-weight: 800; color: #fff; line-height: 1.4; margin-bottom: 4px; }
        #panel-estado-viaje span { color: var(--neon-yellow); }
    </style>
</head>
<body>

    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <!-- TARJETA SUPERIOR -->
    <div class="top-card">
        <div class="top-row">
            <label>📍 Elige tu Destino</label>
            <button id="btn-sentido-pax" class="btn-sentido-pax" onclick="cambiarSentidoPasajero()">IDA</button>
        </div>
        <div class="subida-info">Subida detectada: <span id="txt-subida">Obteniendo GPS...</span></div>
        <select id="select-paradas" class="select-parada" onchange="seleccionarParadaDesdeLista(this.value)">
            <option value="">O toca una parada en el mapa...</option>
        </select>
    </div>

    <!-- PANEL INFERIOR -->
    <div class="bottom-card">
        <!-- FORMULARIO DE RESERVA -->
        <div id="form-reserva-container">
            <input type="text" id="input-nombre-pasajero" class="input-nombre" placeholder="Escribe tu Nombre y Apellido *" autocomplete="name">

            <div class="destino-info">
                <div class="destino-label">Destino seleccionado</div>
                <div id="txt-destino-seleccionado" class="destino-nombre">Ninguno (Toca una parada)</div>
            </div>

            <div class="selector-asientos">
                <span style="font-size: 12px; font-weight: 800;">Asientos:</span>
                <div class="asientos-btn-group">
                    <button id="seat-1" class="btn-seat selected" onclick="setAsientos(1)">1</button>
                    <button id="seat-2" class="btn-seat" onclick="setAsientos(2)">2</button>
                    <button id="seat-3" class="btn-seat" onclick="setAsientos(3)">3</button>
                    <button id="seat-4" class="btn-seat" onclick="setAsientos(4)">4</button>
                </div>
            </div>

            <button id="btn-pedir" class="btn-solicitar" onclick="solicitarReserva()">RESERVAR VIAJE</button>
        </div>

        <!-- PANEL DE ESTADO EN VIVO -->
        <div id="panel-estado-viaje">
            <h3 id="txt-estado-titulo">🚗 ¡MÓVIL ASIGNADO!</h3>
            <p id="txt-info-chofer">Buscando al chofer y esperando confirmación...</p>
        </div>
    </div>

    <!-- Scripts CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://nvumdlxervrewqiiaicl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oVmiLSfe_AJ5iDpeAXIukA_CLdHuwkE';
        const _s = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const paradas = [
            { id: 1, n: 'Av. Derqui y P197 (Cruce Derqui)', c: [-34.537898, -58.794848] },
            { id: 2, n: 'Fray Antonio Marchena y Carlos Eberth', c: [-34.539274, -58.793441] },
            { id: 3, n: 'Fray Antonio Marchena y Descartes', c: [-34.540553, -58.792168] },
            { id: 4, n: 'Av. Derqui y Gral. Juan Lavalle', c: [-34.541319, -58.791487] },
            { id: 5, n: 'Av. Derqui y José C. Paz', c: [-34.542679, -58.790175] },
            { id: 6, n: 'Av. Derqui y Av. José Altuve', c: [-34.544123, -58.788772] },
            { id: 7, n: 'Av. Derqui y Dr. Enrique Finochietto', c: [-34.545472, -58.787421] },
            { id: 8, n: 'Universidad Tecnológica Robotics', c: [-34.548500, -58.784200] },
            { id: 9, n: 'Parque Industrial', c: [-34.552000, -58.780800] },
            { id: 10, n: 'Base Aérea (Entrada Cuartel V)', c: [-34.555000, -58.778000] },
            { id: 11, n: 'Av. Derqui y C. Bartolomé Hidalgo', c: [-34.557029, -58.776122] },
            { id: 12, n: 'Fray Antonio Marchena y Pedro de Mendoza', c: [-34.558350, -58.774500] },
            { id: 13, n: 'Fray Antonio Marchena y Marcos Paz', c: [-34.559853, -58.772330] },
            { id: 14, n: 'Fray Antonio Marchena y Miguel Cané', c: [-34.561176, -58.770641] },
            { id: 15, n: 'Los Aromos y Santander', c: [-34.562495, -58.772093] },
            { id: 16, n: 'Los Aromos y Murillo', c: [-34.564006, -58.773679] },
            { id: 17, n: 'Murillo y Moctezuma', c: [-34.565289, -58.772213] },
            { id: 18, n: 'Murillo y Güiraldes', c: [-34.567268, -58.769484] },
            { id: 19, n: 'Murillo y Watt', c: [-34.569090, -58.767095] },
            { id: 20, n: 'A. Prado 2555', c: [-34.571016, -58.764443] },
            { id: 21, n: 'Prado y Payró', c: [-34.571956, -58.763201] },
            { id: 22, n: 'Prado 1744', c: [-34.577371, -58.755909] },
            { id: 23, n: 'Boulevard Caveri', c: [-34.578528, -58.757064] },
            { id: 24, n: 'Caveri y Azara', c: [-34.579296, -58.755864] },
            { id: 25, n: 'Caveri y Vedia', c: [-34.580020, -58.755063] },
            { id: 26, n: 'Caveri y Tablada', c: [-34.580901, -58.753842] },
            { id: 27, n: 'Caveri y Echeverría', c: [-34.581998, -58.752441] },
            { id: 28, n: 'Caveri y Gálvez', c: [-34.583319, -58.750710] },
            { id: 29, n: 'Caveri (Final)', c: [-34.584740, -58.748804] },
            { id: 30, n: 'Libertador y Aero', c: [-34.585554, -58.749812] },
            { id: 31, n: 'Libertador 7300', c: [-34.586494, -58.750574] },
            { id: 32, n: 'Libertador 7200', c: [-34.588041, -58.751542] },
            { id: 33, n: 'Libertador y Maza', c: [-34.588273, -58.751338] },
            { id: 34, n: 'Maza y Albatros', c: [-34.588771, -58.750804] },
            { id: 35, n: 'Maternidad', c: [-34.588244, -58.749877] },
            { id: 36, n: 'Abasto y Roca', c: [-34.586030, -58.747278] }
        ];

        let map, paradaSeleccionada = null, cantidadAsientos = 1, sentidoPasajero = 'IDA';
        let marcadores = [];
        let ubicacionSubidaTexto = "Cruce Derqui";
        let miReservaID = null;
        let marcadorAutoChofer = null;

        window.addEventListener('DOMContentLoaded', () => {
            map = L.map('map', { zoomControl: false }).setView(paradas[0].c, 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            const select = document.getElementById('select-paradas');

            paradas.forEach((p) => {
                let opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.n;
                select.appendChild(opt);

                let circle = L.circleMarker(p.c, {
                    radius: 8, color: '#000', weight: 2,
                    fillColor: '#00f3ff', fillOpacity: 0.9
                }).addTo(map);

                const popupHTML = `
                    <div class="popup-content">
                        <div class="popup-title">${p.n}</div>
                        <button class="btn-popup-select" onclick="confirmarParada(${p.id})">Elegir como Destino</button>
                    </div>
                `;
                circle.bindPopup(popupHTML);
                marcadores[p.id] = circle;
            });

            // GPS automático para subida (Tu estructura original intacta)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    map.setView([lat, lon], 16);

                    L.marker([lat, lon], {
                        icon: L.divIcon({
                            className: 'custom-pax-marker',
                            html: '<div style="background:#39ff14; width:16px; height:16px; border-radius:50%; border:3px solid #000; box-shadow:0 0 10px #39ff14;"></div>',
                            iconSize: [16, 16]
                        })
                    }).addTo(map);

                    let paradaCercana = paradas[0];
                    let menorDistancia = 999999;
                    paradas.forEach(p => {
                        let dist = Math.hypot(p.c[0] - lat, p.c[1] - lon);
                        if (dist < menorDistancia) {
                            menorDistancia = dist;
                            paradaCercana = p;
                        }
                    });

                    ubicacionSubidaTexto = paradaCercana.n;
                    document.getElementById('txt-subida').innerText = ubicacionSubidaTexto;

                }, () => {
                    document.getElementById('txt-subida').innerText = "Cruce Derqui";
                }, { enableHighAccuracy: true });
            }
        });

        function cambiarSentidoPasajero() {
            sentidoPasajero = (sentidoPasajero === 'IDA') ? 'VUELTA' : 'IDA';
            document.getElementById('btn-sentido-pax').innerText = sentidoPasajero;
            if (paradaSeleccionada) {
                document.getElementById('txt-destino-seleccionado').innerText = `${paradaSeleccionada.n} (${sentidoPasajero})`;
            }
        }

        function confirmarParada(id) {
            paradaSeleccionada = paradas.find(p => p.id === id);
            document.getElementById('txt-destino-seleccionado').innerText = `${paradaSeleccionada.n} (${sentidoPasajero})`;
            document.getElementById('select-paradas').value = id;

            marcadores.forEach(m => m.setStyle({ fillColor: '#00f3ff', radius: 8 }));
            marcadores[id].setStyle({ fillColor: '#ffcc00', radius: 12 });
            map.closePopup();
            map.panTo(paradaSeleccionada.c);
        }

        function seleccionarParadaDesdeLista(id) {
            if (!id) return;
            confirmarParada(parseInt(id));
        }

        // Selección múltiple limpia de asientos: ilumina individualmente desde el 1 hasta el número elegido
        function setAsientos(num) {
            cantidadAsientos = num;
            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById('seat-' + i);
                if (i <= num) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            }
        }

        async function solicitarReserva() {
            const nombrePasajero = document.getElementById('input-nombre-pasajero').value.trim();
            if (!nombrePasajero) {
                alert("Por favor escribe tu Nombre y Apellido para que el chofer te reconozca.");
                document.getElementById('input-nombre-pasajero').focus();
                return;
            }

            if (!paradaSeleccionada) {
                alert("Por favor selecciona una parada de destino tocando en el mapa.");
                return;
            }

            const btnPedir = document.getElementById('btn-pedir');
            btnPedir.innerText = "BUSCANDO MÓVIL...";
            btnPedir.disabled = true;

            try {
                // 1. Buscar móvil online en el sentido correcto
                const { data: moviles, error: errMovil } = await _s
                    .from('estado_movil')
                    .select('*')
                    .eq('esta_online', true)
                    .eq('sentido_flujo', sentidoPasajero)
                    .limit(1);

                if (errMovil || !moviles || moviles.length === 0) {
                    alert("No hay móviles disponibles en sentido " + sentidoPasajero + " en este momento.");
                    btnPedir.innerText = "RESERVAR VIAJE";
                    btnPedir.disabled = false;
                    return;
                }

                const movilAsignado = moviles[0];

                // 2. Insertar reserva en Supabase
                const { data: resData, error: errReserva } = await _s
                    .from('reservas_activas')
                    .insert({
                        id_movil: movilAsignado.id,
                        nombre_pasajero: nombrePasajero,
                        destino: `Sube: ${ubicacionSubidaTexto} ➔ Baja: ${paradaSeleccionada.n}`,
                        asientos: cantidadAsientos,
                        sentido: sentidoPasajero,
                        estado: 'en_curso'
                    })
                    .select()
                    .single();

                if (errReserva) throw errReserva;

                miReservaID = resData.id;

                // Ocultar formulario de reserva y mostrar tarjeta de estado en vivo
                document.getElementById('form-reserva-container').style.display = 'none';
                document.getElementById('panel-estado-viaje').style.display = 'block';
                document.getElementById('txt-info-chofer').innerText = "Solicitud enviada. Esperando que el chofer acepte...";

                // Iniciar escucha en tiempo real del estado y posición del auto
                setInterval(verificarEstadoViajeYAuto, 3000);

            } catch (e) {
                console.error(e);
                alert("Error de conexión. Asegúrate de tener conexión a internet.");
                btnPedir.innerText = "RESERVAR VIAJE";
                btnPedir.disabled = false;
            }
        }

        // Bucle de sincronización en vivo del viaje
        async function verificarEstadoViajeYAuto() {
            if (!miReservaID) return;

            try {
                const { data: reserva, error } = await _s
                    .from('reservas_activas')
                    .select('*')
                    .eq('id', miReservaID)
                    .single();

                if (error || !reserva || reserva.estado === 'finalizado') {
                    alert("El viaje ha finalizado. La aplicación se reiniciará.");
                    location.reload();
                    return;
                }

                // Estado 1: Chofer atendió (en camino a buscar al pasajero)
                if (reserva.estado === 'atendido') {
                    document.getElementById('txt-estado-titulo').innerText = "🚗 ¡CHOFER EN CAMINO!";
                    document.getElementById('txt-info-chofer').innerHTML = `
                        Conductor: <b>${reserva.chofer_nombre || 'Chofer'}</b><br>
                        Auto: <b>${reserva.auto_modelo || 'Vehículo'}</b><br>
                        Patente: <span>${reserva.patente || 'N/D'}</span><br><br>
                        <i>El chofer va en camino a tu parada.</i>
                    `;
                } 
                // Estado 2: Chofer llegó y marcó pasajero a bordo
                else if (reserva.estado === 'a_bordo') {
                    document.getElementById('txt-estado-titulo').innerText = "🚀 ¡YA ESTÁS A BORDO!";
                    document.getElementById('txt-info-chofer').innerHTML = `
                        Conductor: <b>${reserva.chofer_nombre || 'Chofer'}</b><br>
                        Auto: <b>${reserva.auto_modelo || 'Vehículo'}</b><br><br>
                        <span style="color:var(--neon-green); font-size:14px;">¡En viaje rumbo a tu destino!</span>
                    `;
                }

                // Obtener coordenadas en tiempo real del auto del chofer
                const { data: movilInfo } = await _s
                    .from('estado_movil')
                    .select('*')
                    .eq('id', reserva.id_movil)
                    .single();

                if (movilInfo && movilInfo.latitud && movilInfo.longitud) {
                    const lat = movilInfo.latitud;
                    const lon = movilInfo.longitud;

                    if (!marcadorAutoChofer) {
                        marcadorAutoChofer = L.marker([lat, lon], {
                            icon: L.divIcon({
                                className: 'custom-car-marker',
                                html: '<div style="background:#ffcc00; width:22px; height:22px; border-radius:50%; border:3px solid #000; box-shadow:0 0 15px #ffcc00; text-align:center; font-size:10px; font-weight:900; line-height:16px;">🚗</div>',
                                iconSize: [22, 22]
                            })
                        }).addTo(map);
                    } else {
                        marcadorAutoChofer.setLatLng([lat, lon]);
                    }
                }
            } catch (e) {
                console.error("Error al sincronizar viaje:", e);
            }
        }
    </script>
</body>
</html>
