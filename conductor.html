<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Chofer - Tu Móvil Oficial PRO</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ESTILOS FUTURISTAS -->
    <style>
        :root {
            --bg-dark: #05070a;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffcc00;
            --neon-green: #39ff14;
            --neon-red: #ff0055;
            --glass-bg: rgba(10, 16, 26, 0.88);
            --glass-border: rgba(0, 243, 255, 0.25);
            --glass-glow: rgba(0, 243, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); height: 100vh; overflow: hidden; color: #fff; }

        /* SPLASH SCREEN INICIAL */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a3e 0%, #05050f 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999; transition: opacity 0.6s ease, visibility 0.6s;
        }
        .logo-ring {
            width: 120px; height: 120px; border: 3px solid var(--neon-cyan); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3); animation: pulseRing 2s infinite;
        }
        @keyframes pulseRing { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        #splash h1 { color: var(--neon-cyan); margin-top: 20px; font-size: 26px; letter-spacing: 3px; font-weight: 800; }
        #splash p { color: #888; margin-top: 6px; font-size: 13px; }
        .loading-bar { width: 140px; height: 3px; background: #222; border-radius: 3px; margin-top: 20px; overflow: hidden; }
        .loading-bar-inner { width: 0%; height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-yellow)); animation: loadBar 1.5s ease forwards; }
        @keyframes loadBar { to { width: 100%; } }

        /* MODAL DE CONFIGURACIÓN PREVIA */
        #modal-config {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.94); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9998; padding: 20px; display: none;
        }
        .config-card {
            background: var(--glass-bg); border: 2px solid var(--neon-cyan);
            border-radius: 28px; padding: 24px; width: 100%; max-width: 380px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.25); text-align: center;
        }
        .config-card h2 { color: var(--neon-cyan); font-size: 18px; margin-bottom: 6px; font-weight: 900; }
        .config-card p { color: #8a99ad; font-size: 12px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { font-size: 10px; font-weight: 800; color: var(--neon-yellow); letter-spacing: 1px; display: block; margin-bottom: 4px; text-transform: uppercase; }
        .form-control {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
            padding: 12px; border-radius: 14px; color: #fff; font-size: 14px; outline: none;
        }
        .form-control:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,243,255,0.3); }
        .btn-guardar-config {
            background: linear-gradient(135deg, var(--neon-cyan) 0%, #0088cc 100%);
            color: #000; border: none; width: 100%; padding: 14px; border-radius: 16px;
            font-weight: 900; font-size: 15px; cursor: pointer; margin-top: 10px;
            box-shadow: 0 0 20px rgba(0,243,255,0.4);
        }

        /* MAPA Y CAPAS */
        #map-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; overflow: hidden; filter: contrast(1.05) brightness(0.95);
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* ETIQUETAS PERMANENTES */
        .leaflet-tooltip.etiqueta-baja { 
            background: #ffffff !important; color: #000000 !important; border: 2px solid var(--neon-cyan) !important; 
            font-weight: 800 !important; font-size: 11px !important; border-radius: 8px !important; box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;
        }
        .leaflet-tooltip.etiqueta-sube { 
            background: var(--neon-yellow) !important; color: #000000 !important; border: 2px solid var(--neon-red) !important; 
            font-weight: 800 !important; font-size: 11px !important; border-radius: 8px !important; box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;
        }

        /* HEADER & CONTROL FLOTANTE */
        .top-nav {
            position: absolute; top: env(safe-area-inset-top, 12px); left: 12px; right: 12px;
            z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .header-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), inset 0 0 15px var(--glass-glow);
        }

        .connection-status { display: flex; align-items: center; gap: 10px; }
        #status-label { font-size: 10px; font-weight: 900; letter-spacing: 1.5px; color: #8a99ad; text-transform: uppercase; }

        .switch { position: relative; width: 48px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: #16202c; border-radius: 24px; transition: .4s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 2px;
            background: #7a8b9e; border-radius: 50%; transition: .4s;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        input:checked + .slider { background: rgba(57, 255, 20, 0.2); border-color: var(--neon-green); }
        input:checked + .slider:before { transform: translateX(23px); background: var(--neon-green); box-shadow: 0 0 12px var(--neon-green); }

        .header-right-controls { display: flex; align-items: center; gap: 8px; }

        .recaudacion-flotante-box {
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--neon-green);
            padding: 5px 12px; border-radius: 14px;
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 900; color: var(--neon-green);
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.2);
        }

        .speed-box-top {
            display: flex; align-items: center; justify-content: center; gap: 3px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            padding: 5px 12px; border-radius: 14px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
        }
        .speed-box-top #txt-velocidad { font-size: 15px; font-weight: 900; color: #fff; text-shadow: 0 0 8px var(--neon-cyan); }
        .speed-box-top .speed-unit { font-size: 8px; color: var(--neon-cyan); font-weight: 900; }

        #btn-sentido {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            border: none; padding: 7px 14px; border-radius: 14px;
            font-weight: 900; font-size: 11px; color: #000; cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.3); transition: transform 0.2s;
        }
        #btn-sentido:active { transform: scale(0.94); }

        /* BOTONES FLOTANTES */
        .btn-flotante-grupo { position: absolute; bottom: 92px; right: 18px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
        .btn-floating-action {
            background: linear-gradient(135deg, var(--neon-yellow) 0%, #ff9900 100%);
            color: #000; border: none; width: 50px; height: 50px;
            border-radius: 50%; font-size: 20px; font-weight: bold; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4);
            cursor: pointer; pointer-events: auto; transition: transform 0.2s;
        }
        .btn-floating-action:active { transform: scale(0.9); }

        /* ASIENTOS / COCKPIT BAR */
        .bar-asientos-fija {
            position: absolute; bottom: env(safe-area-inset-bottom, 14px); left: 12px; right: 12px; z-index: 998;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 8px; display: flex; gap: 8px; pointer-events: auto;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8), inset 0 0 15px var(--glass-glow);
        }
        .pill {
            flex: 1; height: 54px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 800; color: #617388; cursor: pointer; padding: 4px; transition: all 0.3s ease;
        }
        .pill .seat-num { font-size: 13px; color: #495869; font-weight: 900; }
        .pill .nombre-pax { font-size: 10px; color: #fff; font-weight: 800; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pill .destino-pax { font-size: 8px; color: var(--neon-yellow); font-weight: 700; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .pill.active {
            background: rgba(255, 204, 0, 0.12);
            border-color: var(--neon-yellow);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.25);
        }
        .pill.active .destino-pax { color: var(--neon-yellow); }

        .pill.a-bordo {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        .pill.a-bordo .seat-num, .pill.a-bordo .nombre-pax { color: #fff; text-shadow: 0 0 6px var(--neon-cyan); }
        .pill.a-bordo .destino-pax { color: var(--neon-cyan); }

        /* BOTTOM SHEET OPERATIVO */
        .bottom-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 1001;
            background: rgba(8, 12, 18, 0.96);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--neon-cyan); border-radius: 32px 32px 0 0;
            padding: 16px 20px env(safe-area-inset-bottom, 24px) 20px; max-height: 80vh; overflow-y: auto;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto;
            box-shadow: 0 -10px 40px rgba(0, 243, 255, 0.15);
        }
        .bottom-sheet.expanded { transform: translateY(0%); }
        .drag-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto 16px auto; cursor: pointer; }

        .sheet-stats-grid { display: flex; gap: 12px; margin-bottom: 16px; }
        .q-stat {
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 20px;
            flex: 1; border: 1px solid rgba(255,255,255,0.06); text-align: center;
        }
        .q-label { font-size: 9px; color: #76889b; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        .q-value { font-size: 24px; font-weight: 900; margin-top: 4px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }

        .action-group { display: flex; flex-direction: column; gap: 10px; }
        .btn-action { width: 100%; border: none; padding: 16px; border-radius: 18px; font-weight: 900; font-size: 15px; cursor: pointer; display: none; }
        .btn-vaciar { background: rgba(255, 0, 85, 0.08); color: var(--neon-red); border: 1px solid rgba(255, 0, 85, 0.3); display: block; padding: 12px; font-size: 13px; }
        .btn-finalizar-jornada { display: block !important; background: linear-gradient(135deg, #d31027 0%, #ea384d 100%); color: #fff; margin-top: 6px; box-shadow: 0 4px 15px rgba(234, 56, 77, 0.3); }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN DE CARGA -->

    <!-- Asientos / Cockpit Bar -->

        <div id="pill2" class="pill" onclick="gestionarAsiento(2)"><span class="seat-num">2</span><span id="nombre-pax-2" class="nombre-pax">Libre</span><span id="destino-pax-2" class="destino-pax">-</span></div>
        <div id="pill3" class="pill" onclick="gestionarAsiento(3)"><span class="seat-num">3</span><span id="nombre-pax-3" class="nombre-pax">Libre</span><span id="destino-pax-3" class="destino-pax">-</span></div>
        <div id="pill4" class="pill" onclick="gestionarAsiento(4)"><span class="seat-num">4</span><span id="nombre-pax-4" class="nombre-pax">Libre</span><span id="destino-pax-4" class="destino-pax">-</span></div>
    </div>

    <!-- Panel Inferior -->

        <div class="drag-handle" onclick="cerrarSheet()"></div>
        <div class="sheet-stats-grid">
            <div class="q-stat"><div class="q-label">Pasajeros</div><div id="txt-pax" class="q-value">0</div></div>
            <div class="q-stat"><div class="q-label">Próxima Parada</div><div id="txt-parada" class="q-value" style="font-size: 13px; font-weight: 800; margin-top: 6px;">En línea</div></div>

        <div class="action-group">
            <button class="btn-action btn-vaciar" onclick="confirmarVaciar()">🧹 Vaciar Todos los Asientos</button>
            <button class="btn-action btn-finalizar-jornada" onclick="finalizarJornada()">🔴 Finalizar Jornada Laboral</button>
        </div>
    </div>

    <!-- LÓGICA DE JAVASCRIPT UNIFICADA: MULTIASIENTOS EN BLOQUE + VOZ AUTOMÁTICA -->
    <script>
        const TARIFA_UNICA = 1500;
        const MI_ID_MOVIL = 1;
        const _s = supabase.createClient('https://nvumdlxervrewqiiaicl.supabase.co', 'sb_publishable_oVmiLSfe_AJ5iDpeAXIukA_CLdHuwkE');

        let MI_NOMBRE = localStorage.getItem('driver_nombre_completo') || 'Carlos Cuevas - Ford Fiesta (JCP 478)';

        const paradas = [
            { n: 'Av. Derqui y P197 (Cruce Derqui)', c: [-34.537898, -58.794848] },

            { n: 'Av. Derqui y C. Bartolomé Hidalgo', c: [-34.557029, -58.776122] },
            { n: 'Fray Antonio Marchena y Pedro de Mendoza', c: [-34.558350, -58.774500] },
            { n: 'Fray Antonio Marchena y Marcos Paz', c: [-34.559853, -58.772330] },
            { n: 'Fray Antonio Marchena y Miguel Cané', c: [-34.561176, -58.770641] },
            { n: 'Los Aromos y Santander', c: [-34.562495, -58.772093] },
            { n: 'Los Aromos y Murillo', c: [-34.564006, -58.773679] },
            { n: 'Murillo y Moctezuma', c: [-34.565289, -58.772213] },

            { n: 'Murillo y Watt', c: [-34.569090, -58.767095] },

            { n: 'Maternidad', c: [-34.588244, -58.749877] },
            { n: 'Abasto y Roca', c: [-34.586030, -58.747278] }
        ];

        let map, markerCoche;
        let estaOnline = false, watchId = null, sentidoActual = 'IDA';
        let velocidadActual = 0;
        let markersPax = [], markersDest = [];
        
        let asientos = {
            1: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null },
            2: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null },
            3: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null },
            4: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null }
        };

        let indiceParadaActual = 0;
        let ultimaLlegadaIdx = -1;
        let anunciosIniciados = false;
        const RADIO_LLEGADA = 45;

        function indiceSiguiente(i) {
            return sentidoActual === 'IDA' ? (i + 1) % paradas.length : (i - 1 + paradas.length) % paradas.length;
        }
        function indiceAnterior(i) {
            return sentidoActual === 'IDA' ? (i - 1 + paradas.length) % paradas.length : (i + 1) % paradas.length;
        }

        function anunciar(texto) {
            try {
                if (!window.speechSynthesis) return;
                speechSynthesis.cancel();
                const voz = new SpeechSynthesisUtterance(texto);
                voz.lang = 'es-AR';
                voz.rate = 1.0;
                speechSynthesis.speak(voz);
            } catch (e) {}
        }

        function procesarAnunciosParadas(lat, lon) {
            if (!paradas.length || !map) return;
            let idxCercana = 0, distMin = Infinity;
            const miPos = L.latLng(lat, lon);
            for (let i = 0; i < paradas.length; i++) {
                const d = map.distance(miPos, paradas[i].c);
                if (d < distMin) { distMin = d; idxCercana = i; }
            }

            if (!anunciosIniciados) {
                anunciosIniciados = true;
                indiceParadaActual = idxCercana;
                ultimaLlegadaIdx = idxCercana;
                const sig = indiceSiguiente(indiceParadaActual);
                anunciar('Próxima parada: ' + paradas[sig].n);
            }

            const esperada = indiceSiguiente(indiceParadaActual);
            if (idxCercana === esperada && distMin < RADIO_LLEGADA) {
                if (ultimaLlegadaIdx !== idxCercana) {
                    ultimaLlegadaIdx = idxCercana;
                    indiceParadaActual = idxCercana;
                    anunciar('Hemos llegado a ' + paradas[idxCercana].n);
                    const sig = indiceSiguiente(indiceParadaActual);
                    setTimeout(() => anunciar('Próxima parada: ' + paradas[sig].n), 2600);
                }
            } else if (idxCercana !== indiceParadaActual && idxCercana !== esperada) {
                indiceParadaActual = indiceAnterior(idxCercana);
                ultimaLlegadaIdx = -1;
            }

            const sig = indiceSiguiente(indiceParadaActual);
            const dSig = map.distance(miPos, paradas[sig].c);
            const elParada = document.getElementById('txt-parada');
            if (elParada) elParada.innerText = paradas[sig].n + ' · ' + Math.round(dSig) + 'm';
        }

        function reiniciarAnuncios() {
            anunciosIniciados = false;
            ultimaLlegadaIdx = -1;
        }

        function crearIconoAuto(velocidad) {
            const colorVelocidad = velocidad > 50 ? '#ff0055' : velocidad > 30 ? '#ffcc00' : '#00f3ff';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="50" height="75">
                <ellipse cx="60" cy="30" rx="20" ry="15" fill="${colorVelocidad}" opacity="0.15"/>
                <g transform="translate(30,40)">
                    <ellipse cx="30" cy="85" rx="25" ry="10" fill="#000" opacity="0.3"/>
                    <path d="M5,20 L55,20 L60,80 L0,80 Z" fill="#FFD700" stroke="#000" stroke-width="1"/>
                    <path d="M12,25 L48,25 L52,55 L8,55 Z" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
                    <rect x="8" y="18" width="10" height="4" rx="2" fill="${colorVelocidad}"/>
                    <rect x="42" y="18" width="10" height="4" rx="2" fill="${colorVelocidad}"/>
                </g>
            </svg>`;
            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        window.addEventListener('DOMContentLoaded', () => {
            map = L.map('map', { zoomControl: false }).setView(paradas[0].c, 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.polyline(paradas.map(p => p.c), { color: '#ff0055', weight: 6, opacity: 0.65 }).addTo(map);

            paradas.forEach((p, i) => {
                L.circleMarker(p.c, { radius: 5, color: '#000', weight: 2, fillColor: '#00f3ff', fillOpacity: 0.9 })
                    .addTo(map).bindTooltip((i + 1) + ". " + p.n);
            });

            let miIcono = L.icon({ iconUrl: crearIconoAuto(0), iconSize: [50, 75], iconAnchor: [25, 37] });
            markerCoche = L.marker(paradas[0].c, { icon: miIcono, zIndexOffset: 1000 }).addTo(map);

            setTimeout(() => {
                map.invalidateSize();
                const splash = document.getElementById('splash');
                if (splash) { splash.style.opacity = '0'; setTimeout(() => splash.style.visibility = 'hidden', 600); }

                if (!MI_NOMBRE || MI_NOMBRE === 'null') {
                    abrirConfiguracion();
                } else {
                    iniciarJornadaBase();
                }
            }, 1400);

            setInterval(actualizarYMonitorearReservas, 3000);
        });

        function abrirConfiguracion() {
            document.getElementById('input-nombre-chofer').value = MI_NOMBRE || '';
            document.getElementById('modal-config').style.display = 'flex';
        }

        function guardarConfiguracionYEntrar() {
            const nombreInput = document.getElementById('input-nombre-chofer').value.trim();
            if (!nombreInput) {
                alert("Por favor ingresa tu nombre y vehículo.");
                return;
            }

            MI_NOMBRE = nombreInput;
            localStorage.setItem('driver_nombre_completo', MI_NOMBRE);
            document.getElementById('modal-config').style.display = 'none';
            iniciarJornadaBase();
        }

        function abrirSheet() { document.getElementById('driver-sheet').classList.add('expanded'); }
        function cerrarSheet() { document.getElementById('driver-sheet').classList.remove('expanded'); }

        async function gestionarConexion() {
            if (!MI_NOMBRE) {
                document.getElementById('online-toggle').checked = false;
                abrirConfiguracion();
                return;
            }

            const toggle = document.getElementById('online-toggle');
            const label = document.getElementById('status-label');
            estaOnline = toggle.checked;
            localStorage.setItem('driver_online', estaOnline ? 'true' : 'false');

            if (estaOnline) {
                label.innerText = "CONECTANDO...";
                label.style.color = "#ffcc00";

                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude, lon = pos.coords.longitude;
                    
                    await _s.from('estado_movil').upsert({
                        id: MI_ID_MOVIL,
                        chofer: MI_NOMBRE,
                        esta_online: true,
                        latitud: lat,
                        longitud: lon,
                        sentido_flujo: sentidoActual,
                        ultima_actualizacion: new Date().toISOString()
                    });

                    label.innerText = "EN LÍNEA";
                    label.style.color = "#39ff14";
                    reiniciarAnuncios();
                    iniciarGPS();
                }, () => {
                    toggle.checked = false;
                    label.innerText = "ERROR GPS";
                    label.style.color = "#ff0055";
                }, { enableHighAccuracy: true });
            } else {
                if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
                if (window.speechSynthesis) speechSynthesis.cancel();
                await _s.from('estado_movil').update({ esta_online: false }).eq('id', MI_ID_MOVIL);
                label.innerText = "DESCONECTADO";
                label.style.color = "#76889b";
            }
        }

        function iniciarGPS() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(async (p) => {
                const lat = p.coords.latitude, lon = p.coords.longitude;
                velocidadActual = Math.round((p.coords.speed || 0) * 3.6);
                document.getElementById('txt-velocidad').textContent = velocidadActual;

                if (estaOnline) procesarAnunciosParadas(lat, lon);

                let nuevoIcono = L.icon({ iconUrl: crearIconoAuto(velocidadActual), iconSize: [50, 75], iconAnchor: [25, 37] });
                if (markerCoche) {
                    markerCoche.setLatLng([lat, lon]);
                    markerCoche.setIcon(nuevoIcono);
                }
                if (map) map.panTo([lat, lon]);

                await _s.from('estado_movil').update({ latitud: lat, longitud: lon }).eq('id', MI_ID_MOVIL);
            }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        }

        async function actualizarYMonitorearReservas() {
            if (!MI_ID_MOVIL) return;
            try {
                const { data: reservas, error } = await _s
                    .from('reservas_activas')
                    .select('*')
                    .eq('id_movil', MI_ID_MOVIL)
                    .eq('estado', 'en_curso');

                if (error) throw error;

                markersPax.forEach(m => map.removeLayer(m)); 
                markersDest.forEach(m => map.removeLayer(m));
                markersPax = []; markersDest = [];

                if (reservas) {
                    let totalPax = reservas.length;
                    document.getElementById('txt-pax').innerText = totalPax;
                    document.getElementById('txt-plata').innerText = "$" + (totalPax * TARIFA_UNICA);

                    for(let i=1; i<=4; i++) {
                        asientos[i] = { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null };
                    }

                    reservas.forEach(r => {
                        const nombreDestino = paradas[r.destino_idx] ? paradas[r.destino_idx].n.split(' ')[0] : 'Destino';
                        
                        if (r.asiento_num >= 1 && r.asiento_num <= 4) {
                            asientos[r.asiento_num] = {
                                ocupado: true,
                                nombre: r.nombre_pasajero,
                                destino: nombreDestino,
                                idReserva: r.id,
                                estado: r.estado_pasajero
                            };
                        }

                        if (r.pasajero_lat && r.pasajero_lon) {
                            let mSub = L.circleMarker([r.pasajero_lat, r.pasajero_lon], { color: '#ffcc00', radius: 8, fillColor: '#ff0055', fillOpacity: 0.95 }).addTo(map);
                            mSub.bindTooltip('Sube: ' + r.nombre_pasajero, { permanent: true, direction: 'top', className: 'etiqueta-sube' });
                            markersPax.push(mSub);
                        }

                        if (paradas[r.destino_idx]) {
                            let mBaj = L.circleMarker(paradas[r.destino_idx].c, { color: '#00f3ff', radius: 8, fillColor: '#ffffff', fillOpacity: 0.95 }).addTo(map);
                            mBaj.bindTooltip('Baja: ' + r.nombre_pasajero, { permanent: true, direction: 'top', className: 'etiqueta-baja' });
                            markersDest.push(mBaj);
                        }
                    });

                    actualizarPillsUI();
                }
            } catch (err) { console.error("Error actualizando reservas:", err); }
        }

        function actualizarPillsUI() {
            for (let i = 1; i <= 4; i++) {
                const pill = document.getElementById(`pill${i}`);
                const nombreEl = document.getElementById(`nombre-pax-${i}`);
                const destinoEl = document.getElementById(`destino-pax-${i}`);
                const seat = asientos[i];

                if (seat.ocupado) {
                    if (seat.estado === 'a_bordo') {
                        pill.className = 'pill a-bordo';
                        destinoEl.innerText = '🚀 A BORDO';
                    } else {
                        pill.className = 'pill active';
                        destinoEl.innerText = '➔ ' + seat.destino;
                    }
                    nombreEl.innerText = seat.nombre.split(' ')[0];
                } else {
                    pill.className = 'pill';
                    nombreEl.innerText = 'Libre';
                    destinoEl.innerText = '-';
                }
            }
        }

        // GESTIÓN EN BLOQUE DE MULTIASIENTOS (MARCA O FINALIZA TODOS LOS ASIENTOS DEL PASAJERO JUNTOS)
        async function gestionarAsiento(numSeat) {
            const seat = asientos[numSeat];
            if (!seat.ocupado || !seat.idReserva) return;
            const idReservaActual = seat.idReserva;
            const nombrePaxActual = seat.nombre;

            if (!seat.estado || seat.estado === 'esperando') {
                // Marcar todos los asientos del mismo pasajero a bordo en bloque
                for (let i = 1; i <= 4; i++) {
                    if (asientos[i].nombre === nombrePaxActual) {
                        asientos[i].estado = 'a_bordo';
                        if (asientos[i].idReserva) {
                            await _s.from('reservas_activas').update({ estado_pasajero: 'a_bordo' }).eq('id', asientos[i].idReserva);
                        }
                    }
                }
                actualizarPillsUI();
            } else if (seat.estado === 'a_bordo') {
                // Finalizar y eliminar todos los asientos del mismo pasajero en bloque
                for (let i = 1; i <= 4; i++) {
                    if (asientos[i].nombre === nombrePaxActual) {
                        if (asientos[i].idReserva) {
                            await _s.from('reservas_activas').update({ estado: 'finalizado' }).eq('id', asientos[i].idReserva);
                            await _s.from('reservas_activas').delete().eq('id', asientos[i].idReserva);
                        }
                        asientos[i] = { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null };
                    }
                }
                actualizarPillsUI();
            }
            actualizarYMonitorearReservas();
        }

        async function confirmarVaciar() {
            if (!confirm("¿Liberar todos los asientos?")) return;
            for (let i = 1; i <= 4; i++) {
                if (asientos[i].idReserva) {
                    await _s.from('reservas_activas').update({ estado: 'finalizado' }).eq('id', asientos[i].idReserva);
                    await _s.from('reservas_activas').delete().eq('id', asientos[i].idReserva);
                }
            }
            actualizarYMonitorearReservas();
            cerrarSheet();
        }

        async function cambiarSentido() {
            sentidoActual = (sentidoActual === 'IDA') ? 'VUELTA' : 'IDA';
            localStorage.setItem('driver_sentido', sentidoActual);
            document.getElementById('btn-sentido').innerText = sentidoActual;
            reiniciarAnuncios();
            if (estaOnline) { await _s.from('estado_movil').update({ sentido_flujo: sentidoActual }).eq('id', MI_ID_MOVIL); }
        }

        async function finalizarJornada() {
            if (!confirm("🏁 ¿Finalizar jornada y desconectarte?")) return;
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (window.speechSynthesis) speechSynthesis.cancel();
            await _s.from('estado_movil').update({ esta_online: false }).eq('id', MI_ID_MOVIL);
            localStorage.clear();
            location.reload();
        }

        function iniciarJornadaBase() {
            const sentidoGuardado = localStorage.getItem('driver_sentido');
            if (sentidoGuardado) {
                sentidoActual = sentidoGuardado;
                document.getElementById('btn-sentido').innerText = sentidoActual;
            }
            const onlineGuardado = localStorage.getItem('driver_online');
            if (onlineGuardado === 'true') {
                document.getElementById('online-toggle').checked = true;
                gestionarConexion();
            }
        }
    </script>
</body>
</html>
