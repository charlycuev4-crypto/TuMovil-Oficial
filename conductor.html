<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Chofer - Tu Móvil</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- ESTILOS FUTURISTAS UNIFICADOS -->
    <style>
        :root {
            --bg-dark: #05070a;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffcc00;
            --neon-green: #39ff14;
            --neon-red: #ff0055;
            --glass-bg: rgba(10, 16, 26, 0.85);
            --glass-border: rgba(0, 243, 255, 0.25);
            --glass-glow: rgba(0, 243, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); height: 100vh; overflow: hidden; color: #fff; }

        /* MAPA Y CAPAS */
        #map-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; overflow: hidden; filter: contrast(1.05) brightness(0.95);
        }
        #map { width: 100%; height: 100%; }

        /* HEADER & CONTROL FLOTANTE FUTURISTA */
        .top-nav {
            position: absolute; top: env(safe-area-inset-top, 12px); left: 12px; right: 12px;
            z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .header-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), inset 0 0 15px var(--glass-glow);
        }

        .connection-status { display: flex; align-items: center; gap: 10px; }
        #status-label { font-size: 10px; font-weight: 900; letter-spacing: 1.5px; color: #8a99ad; text-transform: uppercase; }

        .switch { position: relative; width: 48px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: #16202c; border-radius: 24px; transition: .4s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 2px;
            background: #7a8b9e; border-radius: 50%; transition: .4s;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        input:checked + .slider { background: rgba(57, 255, 20, 0.2); border-color: var(--neon-green); }
        input:checked + .slider:before { transform: translateX(23px); background: var(--neon-green); box-shadow: 0 0 12px var(--neon-green); }

        .header-right-controls { display: flex; align-items: center; gap: 8px; }

        .recaudacion-flotante-box {
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--neon-green);
            padding: 5px 12px; border-radius: 14px;
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 900; color: var(--neon-green);
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.2);
        }

        .speed-box-top {
            display: flex; align-items: center; justify-content: center; gap: 3px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            padding: 5px 12px; border-radius: 14px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
        }
        .speed-box-top #txt-velocidad { font-size: 15px; font-weight: 900; color: #fff; text-shadow: 0 0 8px var(--neon-cyan); }
        .speed-box-top .speed-unit { font-size: 8px; color: var(--neon-cyan); font-weight: 900; }

        #btn-sentido {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            border: none; padding: 7px 14px; border-radius: 14px;
            font-weight: 900; font-size: 11px; color: #000; cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.3); transition: transform 0.2s;
        }
        #btn-sentido:active { transform: scale(0.94); }

        /* BOTÓN FLOTANTE MENÚ */
        #btn-abrir-sheet {
            position: absolute; bottom: 92px; right: 18px; z-index: 999;
            background: linear-gradient(135deg, var(--neon-yellow) 0%, #ff9900 100%);
            color: #000; border: none; width: 56px; height: 56px;
            border-radius: 50%; font-size: 24px; font-weight: bold; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4);
            cursor: pointer; pointer-events: auto; transition: transform 0.2s;
        }
        #btn-abrir-sheet:active { transform: scale(0.9); }

        /* ASIENTOS FUTURISTAS (COCKPIT BAR) */
        .bar-asientos-fija {
            position: absolute; bottom: env(safe-area-inset-bottom, 14px); left: 12px; right: 12px; z-index: 998;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 8px; display: flex; gap: 8px; pointer-events: auto;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8), inset 0 0 15px var(--glass-glow);
        }
        .pill {
            flex: 1; height: 54px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 800; color: #617388; cursor: pointer; padding: 4px; transition: all 0.3s ease;
        }
        .pill .seat-num { font-size: 13px; color: #495869; font-weight: 900; }
        .pill .nombre-pax { font-size: 10px; color: #fff; font-weight: 800; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pill .destino-pax { font-size: 8px; color: var(--neon-cyan); font-weight: 700; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .pill.a-bordo {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        .pill.a-bordo .seat-num, .pill.a-bordo .nombre-pax { color: #fff; text-shadow: 0 0 6px var(--neon-cyan); }
        .pill.a-bordo .destino-pax { color: var(--neon-cyan); }

        /* BOTTOM SHEET OPERATIVO */
        .bottom-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 1001;
            background: rgba(8, 12, 18, 0.96);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--neon-cyan); border-radius: 32px 32px 0 0;
            padding: 16px 20px env(safe-area-inset-bottom, 24px) 20px; max-height: 80vh; overflow-y: auto;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto;
            box-shadow: 0 -10px 40px rgba(0, 243, 255, 0.15);
        }
        .bottom-sheet.expanded { transform: translateY(0%); }
        .drag-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto 16px auto; cursor: pointer; }

        .sheet-stats-grid { display: flex; gap: 12px; margin-bottom: 16px; }
        .q-stat {
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 20px;
            flex: 1; border: 1px solid rgba(255,255,255,0.06); text-align: center;
        }
        .q-label { font-size: 9px; color: #76889b; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        .q-value { font-size: 24px; font-weight: 900; margin-top: 4px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }

        .action-group { display: flex; flex-direction: column; gap: 10px; }
        .btn-action { width: 100%; border: none; padding: 16px; border-radius: 18px; font-weight: 900; font-size: 15px; cursor: pointer; display: none; }
        .btn-vaciar { background: rgba(255, 0, 85, 0.08); color: var(--neon-red); border: 1px solid rgba(255, 0, 85, 0.3); display: block; padding: 12px; font-size: 13px; }
        .btn-finalizar-jornada { display: block !important; background: linear-gradient(135deg, #d31027 0%, #ea384d 100%); color: #fff; margin-top: 6px; box-shadow: 0 4px 15px rgba(234, 56, 77, 0.3); }

        /* ALERTA DE RESERVA FUTURISTA */
        .alerta-reserva {
            position: fixed; top: 20px; left: 16px; right: 16px;
            background: rgba(8, 12, 18, 0.98); border: 2px solid var(--neon-yellow);
            border-radius: 24px; color: white; padding: 20px; text-align: center;
            z-index: 10000; transform: translateY(-150%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.4);
        }
        .alerta-reserva.mostrar { transform: translateY(0); }
        .alerta-reserva h2 { color: var(--neon-yellow); font-size: 16px; margin-bottom: 6px; font-weight: 900; }
        .alerta-reserva p { font-size: 13px; color: #fff; margin-bottom: 14px; line-height: 1.4; }
        .alerta-botones { display: flex; gap: 10px; }
        .btn-atender {
            background: linear-gradient(135deg, var(--neon-green) 0%, #208d13 100%);
            color: #000; border: none; padding: 12px 10px; border-radius: 14px;
            font-weight: 900; font-size: 14px; cursor: pointer; flex: 1;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
        .btn-rechazar {
            background: rgba(255, 0, 85, 0.1); color: var(--neon-red);
            border: 1px solid rgba(255, 0, 85, 0.4); padding: 12px 10px; border-radius: 14px;
            font-weight: 900; font-size: 13px; cursor: pointer; flex: 1;
        }
    </style>
</head>
<body>

    <!-- ALERTA DE RESERVA FLOTANTE -->
    <div id="alerta-reserva" class="alerta-reserva">
        <h2>🚨 ¡NUEVA RESERVA!</h2>
        <p id="alerta-texto">Cargando...</p>
        <div class="alerta-botones">
            <button class="btn-rechazar" onclick="rechazarSolicitud()">✖ RECHAZAR</button>
            <button class="btn-atender" onclick="atenderSolicitud()">ATENDER Y ACEPTAR</button>
        </div>
    </div>

    <!-- Controles Superiores -->
    <div class="top-nav">
        <div class="header-bar">
            <div class="connection-status">
                <label class="switch">
                    <input type="checkbox" id="online-toggle" onchange="gestionarConexion()">
                    <span class="slider"></span>
                </label>
                <span id="status-label">DESCONECTADO</span>
            </div>

            <div class="header-right-controls">
                <div class="recaudacion-flotante-box">
                    <span>💵</span> <span id="txt-plata">$0</span>
                </div>
                <div class="speed-box-top">
                    <span id="txt-velocidad">0</span>
                    <span class="speed-unit">KM/H</span>
                </div>
                <button id="btn-sentido" onclick="cambiarSentido()">IDA</button>
            </div>
        </div>
    </div>

    <!-- Mapa -->
    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <button id="btn-abrir-sheet" onclick="abrirSheet()">☰</button>

    <!-- Asientos Abajo -->
    <div class="bar-asientos-fija">
        <div id="pill1" class="pill" onclick="gestionarAsiento(1)">
            <span class="seat-num">1</span>
            <span id="nombre-pax-1" class="nombre-pax">Libre</span>
            <span id="destino-pax-1" class="destino-pax">-</span>
        </div>
        <div id="pill2" class="pill" onclick="gestionarAsiento(2)">
            <span class="seat-num">2</span>
            <span id="nombre-pax-2" class="nombre-pax">Libre</span>
            <span id="destino-pax-2" class="destino-pax">-</span>
        </div>
        <div id="pill3" class="pill" onclick="gestionarAsiento(3)">
            <span class="seat-num">3</span>
            <span id="nombre-pax-3" class="nombre-pax">Libre</span>
            <span id="destino-pax-3" class="destino-pax">-</span>
        </div>
        <div id="pill4" class="pill" onclick="gestionarAsiento(4)">
            <span class="seat-num">4</span>
            <span id="nombre-pax-4" class="nombre-pax">Libre</span>
            <span id="destino-pax-4" class="destino-pax">-</span>
        </div>
    </div>

    <!-- Panel Inferior -->
    <div id="driver-sheet" class="bottom-sheet">
        <div class="drag-handle" onclick="cerrarSheet()"></div>

        <div class="sheet-stats-grid">
            <div class="q-stat">
                <div class="q-label">Pasajeros</div>
                <div id="txt-pax" class="q-value">0</div>
            </div>
            <div class="q-stat">
                <div class="q-label">Próxima Parada</div>
                <div id="txt-parada" class="q-value" style="font-size: 13px; font-weight: 800; margin-top: 6px;">En línea</div>
            </div>
        </div>

        <div class="action-group">
            <button class="btn-action btn-vaciar" onclick="confirmarVaciar()">🧹 Vaciar Todos los Asientos</button>
            <button class="btn-action btn-finalizar-jornada" onclick="finalizarJornada()">🔴 Finalizar Jornada Laboral</button>
        </div>
    </div>

    <!-- Scripts CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- LÓGICA DE JAVASCRIPT CHOFER -->
    <script>
        const TARIFA_UNICA = 1500;
        const _s = supabase.createClient('https://nvumdlxervrewqiiaicl.supabase.co', 'sb_publishable_oVmiLSfe_AJ5iDpeAXIukA_CLdHuwkE');

        let MI_ID_MOVIL = 1;
        let MI_NOMBRE = localStorage.getItem('driver_nombre_completo') || 'Carlos Cuevas - Ford Fiesta (JCP 478)';

        const paradas = [
            { n: 'Av. Derqui y P197 (Cruce Derqui)', c: [-34.537898, -58.794848] },
            { n: 'Fray Antonio Marchena y Carlos Eberth', c: [-34.539274, -58.793441] },
            { n: 'Fray Antonio Marchena y Descartes', c: [-34.540553, -58.792168] },
            { n: 'Av. Derqui y Gral. Juan Lavalle', c: [-34.541319, -58.791487] },
            { n: 'Av. Derqui y José C. Paz', c: [-34.542679, -58.790175] },
            { n: 'Av. Derqui y Av. José Altuve', c: [-34.544123, -58.788772] },
            { n: 'Av. Derqui y Dr. Enrique Finochietto', c: [-34.545472, -58.787421] },
            { n: 'Universidad Tecnológica Robotics', c: [-34.548500, -58.784200] },
            { n: 'Parque Industrial', c: [-34.552000, -58.780800] },
            { n: 'Base Aérea (Entrada Cuartel V / José C. Paz)', c: [-34.555000, -58.778000] },
            { n: 'Av. Derqui y C. Bartolomé Hidalgo', c: [-34.557029, -58.776122] },
            { n: 'Fray Antonio Marchena y Pedro de Mendoza', c: [-34.558350, -58.774500] },
            { n: 'Fray Antonio Marchena y Marcos Paz', c: [-34.559853, -58.772330] },
            { n: 'Fray Antonio Marchena y Miguel Cané', c: [-34.561176, -58.770641] },
            { n: 'Los Aromos y Santander', c: [-34.562495, -58.772093] },
            { n: 'Los Aromos y Murillo', c: [-34.564006, -58.773679] },
            { n: 'Murillo y Moctezuma', c: [-34.565289, -58.772213] },
            { n: 'Murillo y Güiraldes', c: [-34.567268, -58.769484] },
            { n: 'Murillo y Watt', c: [-34.569090, -58.767095] },
            { n: 'A. Prado 2555', c: [-34.571016, -58.764443] },
            { n: 'Prado y Payró', c: [-34.571956, -58.763201] },
            { n: 'Prado 1744', c: [-34.577371, -58.755909] },
            { n: 'Boulevard Caveri', c: [-34.578528, -58.757064] },
            { n: 'Caveri y Azara', c: [-34.579296, -58.755864] },
            { n: 'Caveri y Vedia', c: [-34.580020, -58.755063] },
            { n: 'Caveri y Tablada', c: [-34.580901, -58.753842] },
            { n: 'Caveri y Echeverría', c: [-34.581998, -58.752441] },
            { n: 'Caveri y Gálvez', c: [-34.583319, -58.750710] },
            { n: 'Caveri (Final)', c: [-34.584740, -58.748804] },
            { n: 'Libertador y Aero', c: [-34.585554, -58.749812] },
            { n: 'Libertador 7300', c: [-34.586494, -58.750574] },
            { n: 'Libertador 7200', c: [-34.588041, -58.751542] },
            { n: 'Libertador y Maza', c: [-34.588273, -58.751338] },
            { n: 'Maza y Albatros', c: [-34.588771, -58.750804] },
            { n: 'Maternidad', c: [-34.588244, -58.749877] },
            { n: 'Abasto y Roca', c: [-34.586030, -58.747278] }
        ];

        let map, markerCoche;
        let estaOnline = false, watchId = null, sentidoActual = 'IDA';
        let velocidadActual = 0;
        let reservaPendiente = null;
        let ultimaReservaAlertaId = null;

        let asientos = {
            1: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null },
            2: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null },
            3: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null },
            4: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null }
        };

        let indiceParadaActual = 0;
        let ultimaLlegadaIdx = -1;
        let anunciosIniciados = false;
        const RADIO_LLEGADA = 45;

        function indiceSiguiente(i) {
            return sentidoActual === 'IDA' ? (i + 1) % paradas.length : (i - 1 + paradas.length) % paradas.length;
        }
        function indiceAnterior(i) {
            return sentidoActual === 'IDA' ? (i - 1 + paradas.length) % paradas.length : (i + 1) % paradas.length;
        }

        function anunciar(texto) {
            try {
                if (!window.speechSynthesis) return;
                speechSynthesis.cancel();
                const voz = new SpeechSynthesisUtterance(texto);
                voz.lang = 'es-ES';
                voz.rate = 1;
                voz.pitch = 1;
                speechSynthesis.speak(voz);
            } catch (e) {}
        }

        function procesarAnunciosParadas(lat, lon) {
            if (!paradas.length || !map) return;
            let idxCercana = 0, distMin = Infinity;
            const miPos = L.latLng(lat, lon);
            for (let i = 0; i < paradas.length; i++) {
                const d = map.distance(miPos, paradas[i].c);
                if (d < distMin) { distMin = d; idxCercana = i; }
            }

            if (!anunciosIniciados) {
                anunciosIniciados = true;
                indiceParadaActual = idxCercana;
                ultimaLlegadaIdx = idxCercana;
                const sig = indiceSiguiente(indiceParadaActual);
                anunciar('Próxima parada: ' + paradas[sig].n);
            }

            const esperada = indiceSiguiente(indiceParadaActual);
            if (idxCercana === esperada && distMin < RADIO_LLEGADA) {
                if (ultimaLlegadaIdx !== idxCercana) {
                    ultimaLlegadaIdx = idxCercana;
                    indiceParadaActual = idxCercana;
                    anunciar('Hemos llegado a ' + paradas[idxCercana].n);
                    const sig = indiceSiguiente(indiceParadaActual);
                    setTimeout(() => anunciar('Próxima parada: ' + paradas[sig].n), 2600);
                }
            } else if (idxCercana !== indiceParadaActual && idxCercana !== esperada) {
                indiceParadaActual = indiceAnterior(idxCercana);
                ultimaLlegadaIdx = -1;
            }

            const sig = indiceSiguiente(indiceParadaActual);
            const dSig = map.distance(miPos, paradas[sig].c);
            const elParada = document.getElementById('txt-parada');
            if (elParada) elParada.innerText = paradas[sig].n + ' · ' + Math.round(dSig) + 'm';
        }

        function reiniciarAnuncios() {
            anunciosIniciados = false;
            ultimaLlegadaIdx = -1;
        }

        function crearIconoAuto(angulo, velocidad) {
            const colorVelocidad = velocidad > 50 ? '#ff0055' : velocidad > 30 ? '#ffcc00' : '#00f3ff';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="50" height="75">
                <ellipse cx="60" cy="30" rx="20" ry="15" fill="${colorVelocidad}" opacity="0.15"/>
                <g transform="translate(30,40)">
                    <ellipse cx="30" cy="85" rx="25" ry="10" fill="#000" opacity="0.3"/>
                    <path d="M5,20 L55,20 L60,80 L0,80 Z" fill="#FFD700" stroke="#000" stroke-width="1"/>
                    <path d="M12,25 L48,25 L52,55 L8,55 Z" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
                    <rect x="8" y="18" width="10" height="4" rx="2" fill="${colorVelocidad}"/>
                    <rect x="42" y="18" width="10" height="4" rx="2" fill="${colorVelocidad}"/>
                </g>
            </svg>`;
            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        window.addEventListener('DOMContentLoaded', () => {
            map = L.map('map', { zoomControl: false }).setView(paradas[0].c, 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            L.polyline(paradas.map(p => p.c), { color: '#ff0055', weight: 6, opacity: 0.65 }).addTo(map);

            paradas.forEach((p, i) => {
                L.circleMarker(p.c, { radius: 5, color: '#000', weight: 2, fillColor: '#00f3ff', fillOpacity: 0.9 })
                    .addTo(map).bindTooltip((i + 1) + ". " + p.n);
            });

            let miIcono = L.icon({ iconUrl: crearIconoAuto(0, 0), iconSize: [50, 75], iconAnchor: [25, 37] });
            markerCoche = L.marker(paradas[0].c, { icon: miIcono, zIndexOffset: 1000 }).addTo(map);

            iniciarJornadaBase();
            configurarPersistenciaSegundoPlano();
        });

        // PERSISTENCIA ROBUSTA: EVITA QUE SE CORTE AL CAMBIAR DE PESTAÑA
        function configurarPersistenciaSegundoPlano() {
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                    if (estaOnline) {
                        if (!watchId) iniciarGPS();
                        escucharReservas();
                        actualizarEstadisticas();
                    }
                }

            window.addEventListener("pageshow", (event) => {
                if (estaOnline) {
                    if (!watchId) iniciarGPS();
                    escucharReservas();
                }
            });
        }

        function iniciarJornadaBase() {
            const sentidoGuardado = localStorage.getItem('driver_sentido');
            if (sentidoGuardado) {
                sentidoActual = sentidoGuardado;
                document.getElementById('btn-sentido').innerText = sentidoActual;
            }

            const onlineGuardado = localStorage.getItem('driver_online');
            if (onlineGuardado === 'true') {
                document.getElementById('online-toggle').checked = true;
                gestionarConexion();
            }

            setInterval(escucharReservas, 2500);
            setInterval(actualizarEstadisticas, 3500);
        }

        function abrirSheet() { document.getElementById('driver-sheet').classList.add('expanded'); }
        function cerrarSheet() { document.getElementById('driver-sheet').classList.remove('expanded'); }

                    await _s.from('estado_movil').upsert({

                        chofer: MI_NOMBRE,
                        esta_online: true,
                        latitud: lat,
                        longitud: lon,

                    label.style.color = "#39ff14";
                    reiniciarAnuncios();
                    iniciarGPS();

                label.innerText = "DESCONECTADO";
                label.style.color = "#76889b";
            }
        }
