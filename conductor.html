<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Chofer - Tu Móvil</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-dark: #05070a;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffcc00;
            --neon-green: #39ff14;
            --neon-red: #ff3333;
            --glass-bg: rgba(10, 16, 26, 0.90);
            --glass-border: rgba(0, 243, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); height: 100vh; overflow: hidden; color: #fff; }

        /* MAPA */
        #map-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #map { width: 100%; height: 100%; }

        /* PANTALLA DE LOGIN INICIAL */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.95); z-index: 9999;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: var(--glass-bg); border: 1px solid var(--neon-cyan);
            border-radius: 24px; padding: 24px; width: 100%; max-width: 380px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); text-align: center;
        }
        .login-card h2 { font-size: 18px; color: var(--neon-cyan); margin-bottom: 8px; font-weight: 900; }
        .login-card p { font-size: 12px; color: #a0b0c0; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { font-size: 11px; font-weight: 800; color: var(--neon-yellow); display: block; margin-bottom: 4px; text-transform: uppercase; }
        .form-group input {
            width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(0, 243, 255, 0.3);
            color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 14px; outline: none;
        }
        .btn-ingresar {
            width: 100%; background: linear-gradient(135deg, var(--neon-cyan) 0%, #0088cc 100%);
            color: #000; border: none; padding: 12px; border-radius: 14px;
            font-size: 15px; font-weight: 900; cursor: pointer; margin-top: 10px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        /* ALERTA FLOTANTE DE RESERVAS */
        .alerta-reserva {
            position: fixed; top: 80px; left: 16px; right: 16px; z-index: 2000;
            background: rgba(10, 16, 26, 0.98); border: 2px solid var(--neon-yellow);
            border-radius: 20px; padding: 16px; box-shadow: 0 0 30px rgba(255, 204, 0, 0.4);
            display: none; text-align: center;
        }
        .alerta-reserva h2 { color: var(--neon-yellow); font-size: 16px; margin-bottom: 6px; font-weight: 900; }
        .alerta-reserva p { color: #fff; font-size: 13px; margin-bottom: 14px; line-height: 1.4; }
        .btn-atender {
            background: linear-gradient(135deg, var(--neon-green) 0%, #208d13 100%);
            color: #000; border: none; padding: 12px; border-radius: 12px;
            font-weight: 900; font-size: 14px; cursor: pointer; width: 100%;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }

        /* CONTROLES SUPERIORES */
        .top-nav {
            position: absolute; top: env(safe-area-inset-top, 16px); left: 16px; right: 16px;
            z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .header-bar {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7); pointer-events: auto;
        }

        .connection-status { display: flex; align-items: center; gap: 8px; }
        /* Switch */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ff3333; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        input:checked + .slider:before { transform: translateX(20px); }
        #status-label { font-size: 11px; font-weight: 900; color: #ff3333; letter-spacing: 0.5px; }

        .header-right-controls { display: flex; align-items: center; gap: 8px; }
        .recaudacion-flotante-box { background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 800; color: var(--neon-green); border: 1px solid rgba(57,255,20,0.3); }
        .speed-box-top { background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 10px; font-size: 14px; font-weight: 900; color: var(--neon-cyan); border: 1px solid var(--glass-border); }
        .speed-unit { font-size: 8px; color: #8a99ad; display: block; text-align: center; }
        #btn-sentido {
            background: linear-gradient(135deg, var(--neon-yellow) 0%, #ff9900 100%);
            border: none; padding: 8px 14px; border-radius: 12px;
            font-weight: 900; font-size: 11px; color: #000; cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        /* BARRA FIJA DE ASIENTOS (INFERIOR) */
        .bar-asientos-fija {
            position: absolute; bottom: env(safe-area-inset-bottom, 20px); left: 16px; right: 16px;
            z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
            pointer-events: auto;
        }
        .pill {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 8px 4px; text-align: center; cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); transition: 0.2s;
        }
        .pill.ocupado {
            background: rgba(0, 243, 255, 0.15); border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        .seat-num { font-size: 10px; font-weight: 800; color: #8a99ad; display: block; }
        .pill.ocupado .seat-num { color: var(--neon-cyan); }
        .nombre-pax { font-size: 11px; font-weight: 900; color: #fff; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0; }
        .destino-pax { font-size: 9px; color: #a0b0c0; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <!-- LOGIN INICIAL CHOFER -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-card">
            <h2>🚗 Tu Móvil - Ingreso Chofer</h2>
            <p>Configura los datos de tu vehículo para empezar a recibir pasajeros.</p>
            
            <div class="form-group">
                <label>Tu Nombre y Apellido</label>
                <input type="text" id="input-nombre" placeholder="Ej: Carlos Cuevas" />
            </div>
            
            <div class="form-group">
                <label>Patente / Dominio</label>
                <input type="text" id="input-patente" placeholder="Ej: JCP 478" />
            </div>
            
            <div class="form-group">
                <label>Modelo y Color del Auto</label>
                <input type="text" id="input-auto" placeholder="Ej: Ford Fiesta Amarillo" />
            </div>

            <button class="btn-ingresar" onclick="guardarDatosChofer()">Comenzar a Trabajar</button>
        </div>
    </div>

    <!-- ALERTA FLOTANTE DE RESERVA -->
    <div id="alerta-reserva" class="alerta-reserva">
        <h2>🚨 ¡NUEVA RESERVA!</h2>
        <p id="alerta-texto">Cargando...</p>
        <button class="btn-atender" onclick="atenderSolicitud()">ATENDER SOLICITUD</button>
    </div>

    <!-- CONTROLES SUPERIORES -->
    <div class="top-nav">
        <div class="header-bar">
            <div class="connection-status">
                <label class="switch">
                    <input type="checkbox" id="online-toggle" onchange="gestionarConexion()">
                    <span class="slider"></span>
                </label>
                <span id="status-label">DESCONECTADO</span>
            </div>

            <div class="header-right-controls">
                <div class="recaudacion-flotante-box">
                    <span>💵</span> <span id="txt-plata">$0</span>
                </div>
                <div class="speed-box-top">
                    <span id="txt-velocidad">0</span>
                    <span class="speed-unit">KM/H</span>
                </div>
                <button id="btn-sentido" onclick="cambiarSentido()">IDA</button>
            </div>
        </div>
    </div>

    <!-- MAPA -->
    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <!-- BARRA FIJA DE ASIENTOS INFERIOR -->
    <div class="bar-asientos-fija">
        <div id="pill1" class="pill" onclick="gestionarAsiento(1)">
            <span class="seat-num">1</span>
            <span id="nombre-pax-1" class="nombre-pax">Libre</span>
            <span id="destino-pax-1" class="destino-pax">-</span>
        </div>
        <div id="pill2" class="pill" onclick="gestionarAsiento(2)">
            <span class="seat-num">2</span>
            <span id="nombre-pax-2" class="nombre-pax">Libre</span>
            <span id="destino-pax-2" class="destino-pax">-</span>
        </div>
        <div id="pill3" class="pill" onclick="gestionarAsiento(3)">
            <span class="seat-num">3</span>
            <span id="nombre-pax-3" class="nombre-pax">Libre</span>
            <span id="destino-pax-3" class="destino-pax">-</span>
        </div>
        <div id="pill4" class="pill" onclick="gestionarAsiento(4)">
            <span class="seat-num">4</span>
            <span id="nombre-pax-4" class="nombre-pax">Libre</span>
            <span id="destino-pax-4" class="destino-pax">-</span>
        </div>
    </div>

    <!-- SCRIPTS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SCRIPT DE LÓGICA UNIFICADO -->
    <script>
        const SUPABASE_URL = 'https://nvumdlxervrewqiiaicl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oVmiLSfe_AJ5iDpeAXIukA_CLdHuwkE';
        const _s = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let miIdMovil = 1;
        let datosChofer = { nombre: '', patente: '', auto: '' };
        let estaOnline = false;
        let sentidoFlujo = 'IDA';
        let map, marcadorChofer = null;
        let watchId = null;
        let reservaPendiente = null;
        let ultimaReservaAlertaId = null;

        let asientos = {
            1: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null },
            2: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null },
            3: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null },
            4: { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null }
        };

        const paradas = [
            { id: 1, n: 'Av. Derqui y P197 (Cruce Derqui)', c: [-34.537898, -58.794848] },
            { id: 2, n: 'Fray Antonio Marchena y Carlos Eberth', c: [-34.539274, -58.793441] },
            { id: 3, n: 'Fray Antonio Marchena y Descartes', c: [-34.540553, -58.792168] },
            { id: 4, n: 'Av. Derqui y Gral. Juan Lavalle', c: [-34.541319, -58.791487] },
            { id: 5, n: 'Av. Derqui y José C. Paz', c: [-34.542679, -58.790175] },
            { id: 6, n: 'Av. Derqui y Av. José Altuve', c: [-34.544123, -58.788772] },
            { id: 7, n: 'Av. Derqui y Dr. Enrique Finochietto', c: [-34.545472, -58.787421] },
            { id: 8, n: 'Universidad Tecnológica Robotics', c: [-34.548500, -58.784200] },
            { id: 9, n: 'Parque Industrial', c: [-34.552000, -58.780800] },
            { id: 10, n: 'Base Aérea (Entrada Cuartel V)', c: [-34.555000, -58.778000] },
            { id: 11, n: 'Av. Derqui y C. Bartolomé Hidalgo', c: [-34.557029, -58.776122] },
            { id: 12, n: 'Fray Antonio Marchena y Pedro de Mendoza', c: [-34.558350, -58.774500] },
            { id: 13, n: 'Fray Antonio Marchena y Marcos Paz', c: [-34.559853, -58.772330] },
            { id: 14, n: 'Fray Antonio Marchena y Miguel Cané', c: [-34.561176, -58.770641] },
            { id: 15, n: 'Los Aromos y Santander', c: [-34.562495, -58.772093] },
            { id: 16, n: 'Los Aromos y Murillo', c: [-34.564006, -58.773679] },
            { id: 17, n: 'Murillo y Moctezuma', c: [-34.565289, -58.772213] },
            { id: 18, n: 'Murillo y Güiraldes', c: [-34.567268, -58.769484] },
            { id: 19, n: 'Murillo y Watt', c: [-34.569090, -58.767095] },
            { id: 20, n: 'A. Prado 2555', c: [-34.571016, -58.764443] },
            { id: 21, n: 'Prado y Payró', c: [-34.571956, -58.763201] },
            { id: 22, n: 'Prado 1744', c: [-34.577371, -58.755909] },
            { id: 23, n: 'Boulevard Caveri', c: [-34.578528, -58.757064] },
            { id: 24, n: 'Caveri y Azara', c: [-34.579296, -58.755864] },
            { id: 25, n: 'Caveri y Vedia', c: [-34.580020, -58.755063] },
            { id: 26, n: 'Caveri y Tablada', c: [-34.580901, -58.753842] },
            { id: 27, n: 'Caveri y Echeverría', c: [-34.581998, -58.752441] },
            { id: 28, n: 'Caveri y Gálvez', c: [-34.583319, -58.750710] },
            { id: 29, n: 'Caveri (Final)', c: [-34.584740, -58.748804] },
            { id: 30, n: 'Libertador y Aero', c: [-34.585554, -58.749812] },
            { id: 31, n: 'Libertador 7300', c: [-34.586494, -58.750574] },
            { id: 32, n: 'Libertador 7200', c: [-34.588041, -58.751542] },
            { id: 33, n: 'Libertador y Maza', c: [-34.588273, -58.751338] },
            { id: 34, n: 'Maza y Albatros', c: [-34.588771, -58.750804] },
            { id: 35, n: 'Maternidad', c: [-34.588244, -58.749877] },
            { id: 36, n: 'Abasto y Roca', c: [-34.586030, -58.747278] }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            inicializarMapa();
            
            const guardado = localStorage.getItem('chofer_datos');
            if (guardado) {
                datosChofer = JSON.parse(guardado);
                document.getElementById('login-overlay').style.display = 'none';
            }

            setInterval(escucharReservas, 3000);
        });

        function inicializarMapa() {
            map = L.map('map', { zoomControl: false }).setView(paradas[0].c, 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            setTimeout(() => { map.invalidateSize(); }, 300);

            paradas.forEach((p) => {
                L.circleMarker(p.c, {
                    radius: 6, color: '#000', weight: 2,
                    fillColor: '#00f3ff', fillOpacity: 0.9
                }).addTo(map).bindPopup(`<b>Parada:</b> ${p.n}`);
            });
        }

        function sonarAlarma() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.log("Audio en espera de interacción");
            }
        }

        function guardarDatosChofer() {
            const nombre = document.getElementById('input-nombre').value.trim();
            const patente = document.getElementById('input-patente').value.trim();
            const auto = document.getElementById('input-auto').value.trim();

            if (!nombre || !patente) {
                alert("Por favor completa tu Nombre y Patente.");
                return;
            }

            datosChofer = { nombre, patente, auto };
            localStorage.setItem('chofer_datos', JSON.stringify(datosChofer));
            document.getElementById('login-overlay').style.display = 'none';
        }

        function gestionarConexion() {
            const chk = document.getElementById('online-toggle');
            const lbl = document.getElementById('status-label');
            estaOnline = chk.checked;

            if (estaOnline) {
                lbl.innerText = "EN LÍNEA";
                lbl.style.color = "#39ff14";
                iniciarGPS();
            } else {
                lbl.innerText = "DESCONECTADO";
                lbl.style.color = "#ff3333";
                detenerGPS();
                actualizarEstadoSupabase(false);
            }
        }

        function cambiarSentido() {
            sentidoFlujo = (sentidoFlujo === 'IDA') ? 'VUELTA' : 'IDA';
            document.getElementById('btn-sentido').innerText = sentidoFlujo;
            if (estaOnline) {
                actualizarEstadoSupabase(true);
            }
        }

        function iniciarGPS() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const vel = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(0) : 0;

                    document.getElementById('txt-velocidad').innerText = vel;

                    if (!marcadorChofer) {
                        marcadorChofer = L.marker([lat, lon], {
                            icon: L.divIcon({
                                className: 'custom-driver-marker',
                                html: '<div style="background:#00f3ff; width:18px; height:18px; border-radius:50%; border:3px solid #000; box-shadow:0 0 12px #00f3ff; text-align:center; font-size:9px;">🚕</div>',
                                iconSize: [18, 18]
                            })
                        }).addTo(map);
                    } else {
                        marcadorChofer.setLatLng([lat, lon]);
                    }

                    map.panTo([lat, lon]);
                    actualizarPosicionSupabase(lat, lon);
                }, (err) => console.error(err), { enableHighAccuracy: true });
            }
        }

        function detenerGPS() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }

        async function actualizarPosicionSupabase(lat, lon) {
            await _s.from('estado_movil').upsert({
                id: miIdMovil,
                chofer: datosChofer.nombre || 'Carlos Cuevas',
                patente: datosChofer.patente || 'JCP 478',
                auto: datosChofer.auto || 'Ford Fiesta',
                esta_online: estaOnline,
                latitud: lat,
                longitud: lon,
                sentido_flujo: sentidoFlujo,
                updated_at: new Date()
            });
        }

        async function actualizarEstadoSupabase(online) {
            await _s.from('estado_movil').upsert({
                id: miIdMovil,
                esta_online: online,
                sentido_flujo: sentidoFlujo,
                updated_at: new Date()
            });
        }

        async function escucharReservas() {
            if (!estaOnline) return;

            try {
                const { data: reservas, error } = await _s
                    .from('reservas_activas')
                    .select('*')
                    .eq('id_movil', miIdMovil)
                    .eq('estado', 'en_curso')
                    .limit(1);

                if (error) throw error;

                if (reservas && reservas.length > 0) {
                    const r = reservas[0];

                    if (ultimaReservaAlertaId !== r.id) {
                        ultimaReservaAlertaId = r.id;
                        reservaPendiente = r;

                        document.getElementById('alerta-texto').innerHTML = `
                            <b>Pasajero:</b> ${r.nombre_pasajero}<br>
                            <b>Ruta:</b> ${r.destino}<br>
                            <b>Asientos:</b> ${r.asientos}
                        `;

                        document.getElementById('alerta-reserva').style.display = 'block';
                        sonarAlarma();
                    }
                }
            } catch (e) {
                console.error("Error escuchando reservas:", e);
            }
        }

        async function atenderSolicitud() {
            if (!reservaPendiente) return;

            try {
                const numAsientosReq = parseInt(reservaPendiente.asientos) || 1;
                let asignados = 0;

                for (let i = 1; i <= 4; i++) {
                    if (!asientos[i].ocupado && asignados < numAsientosReq) {
                        asientos[i].ocupado = true;
                        asientos[i].nombre = reservaPendiente.nombre_pasajero;
                        asientos[i].destino = reservaPendiente.destino;
                        asientos[i].idReserva = reservaPendiente.id;
                        asientos[i].estado = 'atendido';
                        asignados++;
                    }
                }

                await _s
                    .from('reservas_activas')
                    .update({ 
                        estado: 'atendido',
                        chofer_nombre: datosChofer.nombre,
                        auto_modelo: datosChofer.auto,
                        patente: datosChofer.patente
                    })
                    .eq('id', reservaPendiente.id);

                actualizarPillsUI();
                document.getElementById('alerta-reserva').style.display = 'none';
                alert(`¡Solicitud atendida! El pasajero ${reservaPendiente.nombre_pasajero} ha sido notificado en camino.`);
                reservaPendiente = null;

            } catch (e) {
                console.error("Error al atender solicitud:", e);
            }
        }

        // Gestión del asiento adaptada para cambiar de "atendido" ➔ "a_bordo" ➔ "finalizado"
        async function gestionarAsiento(numSeat) {
            const seat = asientos[numSeat];

            if (!seat.ocupado) {
                alert(`El Asiento ${numSeat} está libre actualmente.`);
                return;
            }

            if (seat.estado === 'atendido' || !seat.estado) {
                const subir = confirm(`¿Marcar a ${seat.nombre} (Asiento ${numSeat}) como A BORDO?`);
                if (subir) {
                    seat.estado = 'a_bordo';
                    await _s.from('reservas_activas').update({ estado: 'a_bordo' }).eq('id', seat.idReserva);
                    actualizarPillsUI();
                    alert(`Pasajero ${seat.nombre} marcado A BORDO.`);
                }
            } else if (seat.estado === 'a_bordo') {
                const finalizar = confirm(`¿Finalizar el viaje y liberar el Asiento ${numSeat} de ${seat.nombre}?`);
                if (finalizar) {
                    if (seat.idReserva) {
                        await _s.from('reservas_activas').update({ estado: 'finalizado' }).eq('id', seat.idReserva);
                    }
                    asientos[numSeat] = { ocupado: false, nombre: 'Libre', destino: '-', idReserva: null, estado: null };
                    actualizarPillsUI();
                    alert("Viaje finalizado y asiento liberado.");
                }
            }
        }

        function actualizarPillsUI() {
            for (let i = 1; i <= 4; i++) {
                const pill = document.getElementById(`pill${i}`);
                const nombreEl = document.getElementById(`nombre-pax-${i}`);
                const destinoEl = document.getElementById(`destino-pax-${i}`);
                const seat = asientos[i];

                if (seat.ocupado) {
                    pill.classList.add('ocupado');
                    nombreEl.innerText = seat.nombre;
                    destinoEl.innerText = seat.estado === 'a_bordo' ? '🚀 A BORDO' : '🚗 EN CAMINO';
                } else {
                    pill.classList.remove('ocupado');
                    nombreEl.innerText = 'Libre';
                    destinoEl.innerText = '-';
                }
            }
        }
    </script>
</body>
</html>
