<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tu Móvil - Chofer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-dark: #05070a;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffcc00;
            --neon-green: #39ff14;
            --neon-red: #ff3333;
            --glass-bg: rgba(10, 16, 26, 0.90);
            --glass-border: rgba(0, 243, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); height: 100vh; overflow: hidden; color: #fff; }

        #map-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #map { width: 100%; height: 100%; }

        /* PANEL SUPERIOR DE ESTADO */
        .top-card {
            position: absolute; top: env(safe-area-inset-top, 16px); left: 16px; right: 16px;
            z-index: 1000; background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 12px 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: space-between;
        }

        .switch-container { display: flex; align-items: center; gap: 10px; }
        
        .status-dot {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red);
            transition: 0.3s;
        }
        .status-dot.online {
            background: var(--neon-green); box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-toggle-online {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 12px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-toggle-online.active {
            background: rgba(57, 255, 20, 0.15); border-color: var(--neon-green); color: var(--neon-green);
        }

        .btn-sentido-driver {
            background: linear-gradient(135deg, var(--neon-yellow) 0%, #ff9900 100%);
            border: none; padding: 8px 16px; border-radius: 12px;
            font-weight: 900; font-size: 12px; color: #000; cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        /* TARJETA DE RESERVAS ENTRANTES (INFERIOR) */
        .bottom-card {
            position: absolute; bottom: env(safe-area-inset-bottom, 20px); left: 16px; right: 16px;
            z-index: 1000; background: var(--glass-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--neon-cyan); border-radius: 24px;
            padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: none; /* Se muestra solo cuando entra un viaje */
        }

        .reserva-title { font-size: 11px; font-weight: 800; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .reserva-pasajero { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 4px; }
        .reserva-detalle { font-size: 13px; color: #a0b0c0; margin-bottom: 12px; font-weight: 700; }
        .reserva-detalle span { color: var(--neon-yellow); }

        .btn-completar {
            width: 100%; background: linear-gradient(135deg, var(--neon-green) 0%, #208d13 100%);
            color: #000; border: none; padding: 12px; border-radius: 14px;
            font-size: 14px; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
    </style>
</head>
<body>

    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <!-- PANEL SUPERIOR -->
    <div class="top-card">
        <div class="switch-container">
            <div id="dot-estado" class="status-dot"></div>
            <button id="btn-estado" class="btn-toggle-online" onclick="toggleOnline()">DESCONECTADO</button>
        </div>
        <button id="btn-sentido" class="btn-sentido-driver" onclick="cambiarSentidoDriver()">IDA</button>
    </div>

    <!-- TARJETA DE VIAJE ENTRANTE -->
    <div id="card-reserva" class="bottom-card">
        <div class="reserva-title">🚨 ¡Nueva Solicitud de Pasajero!</div>
        <div id="txt-nombre-pax" class="reserva-pasajero">Cargando...</div>
        <div id="txt-ruta-pax" class="reserva-detalle">Destino: -</div>
        <div id="txt-asientos-pax" class="reserva-detalle" style="margin-bottom: 12px;">Asientos: 1</div>
        <button class="btn-completar" onclick="finalizarViaje()">FINALIZAR / LIBERAR VIAJE</button>
    </div>

    <!-- Scripts CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Configuración protegida de Supabase
        const SUPABASE_URL = 'https://nvumdlxervrewqiiaicl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oVmiLSfe_AJ5iDpeAXIukA_CLdHuwkE';
        const _s = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const miIdMovil = 1; // Coche #1
        let map, marcadorChofer = null;
        let estaOnline = false;
        let sentidoDriver = 'IDA';
        let idReservaActual = null;
        let watchId = null;

        window.addEventListener('DOMContentLoaded', () => {
            // Inicializar mapa centrado en zona operativa
            map = L.map('map', { zoomControl: false }).setView([-34.537898, -58.794848], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Iniciar bucle para escuchar reservas del pasajero cada 3 segundos
            setInterval(verificarReservasEntrantes, 3000);
        });

        function toggleOnline() {
            estaOnline = !estaOnline;
            const dot = document.getElementById('dot-estado');
            const btn = document.getElementById('btn-estado');

            if (estaOnline) {
                dot.classList.add('online');
                btn.classList.add('active');
                btn.innerText = "EN LÍNEA";
                iniciarGPSChofer();
            } else {
                dot.classList.remove('online');
                btn.classList.remove('active');
                btn.innerText = "DESCONECTADO";
                detenerGPSChofer();
                actualizarEstadoSupabase(false);
            }
        }

        function cambiarSentidoDriver() {
            sentidoDriver = (sentidoDriver === 'IDA') ? 'VUELTA' : 'IDA';
            document.getElementById('btn-sentido').innerText = sentidoDriver;
            if (estaOnline) {
                actualizarPosicionSupabase(-34.537898, -58.794848);
            }
        }

        function iniciarGPSChofer() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;

                    if (!marcadorChofer) {
                        marcadorChofer = L.marker([lat, lon], {
                            icon: L.divIcon({
                                className: 'custom-driver-marker',
                                html: '<div style="background:#00f3ff; width:18px; height:18px; border-radius:50%; border:3px solid #000; box-shadow:0 0 12px #00f3ff;"></div>',
                                iconSize: [18, 18]
                            })
                        }).addTo(map);
                    } else {
                        marcadorChofer.setLatLng([lat, lon]);
                    }

                    map.panTo([lat, lon]);
                    actualizarPosicionSupabase(lat, lon);

                }, (err) => {
                    console.error("Error GPS:", err);
                }, { enableHighAccuracy: true });
            }
        }

        function detenerGPSChofer() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }

        async function actualizarPosicionSupabase(lat, lon) {
            await _s.from('estado_movil').upsert({
                id: miIdMovil,
                chofer: 'Chofer Coche 1',
                esta_online: estaOnline,
                latitud: lat,
                longitud: lon,
                sentido_flujo: sentidoDriver,
                updated_at: new Date()
            });
        }

        async function actualizarEstadoSupabase(online) {
            await _s.from('estado_movil').upsert({
                id: miIdMovil,
                esta_online: online,
                sentido_flujo: sentidoDriver,
                updated_at: new Date()
            });
        }

        // Bucle para buscar si hay reservas pendientes para este coche
        async function verificarReservasEntrantes() {
            if (!estaOnline) return;

            try {
                const { data: reservas, error } = await _s
                    .from('reservas_activas')
                    .select('*')
                    .eq('id_movil', miIdMovil)
                    .eq('estado', 'en_curso')
                    .limit(1);

                if (error) throw error;

                const card = document.getElementById('card-reserva');

                if (reservas && reservas.length > 0) {
                    const r = reservas[0];
                    idReservaActual = r.id;

                    document.getElementById('txt-nombre-pax').innerText = `👤 ${r.nombre_pasajero}`;
                    document.getElementById('txt-ruta-pax').innerHTML = `Destino: <span>${r.destino}</span>`;
                    document.getElementById('txt-asientos-pax').innerText = `Asientos solicitados: ${r.asientos} (${r.sentido})`;
                    
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                    idReservaActual = null;
                }
            } catch (e) {
                console.error("Error consultando reservas:", e);
            }
        }

        async function finalizarViaje() {
            if (!idReservaActual) return;

            try {
                // Marcar la reserva como completada o eliminarla de activas
                await _s
                    .from('reservas_activas')
                    .update({ estado: 'finalizado' })
                    .eq('id', idReservaActual);

                document.getElementById('card-reserva').style.display = 'none';
                idReservaActual = null;
                alert("¡Viaje finalizado con éxito! El móvil queda libre para nuevas solicitudes.");
            } catch (e) {
                console.error("Error al finalizar viaje:", e);
            }
        }
    </script>
</body>
</html>
