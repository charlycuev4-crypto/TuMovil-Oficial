<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tu Móvil - Chofer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-dark: #05070a;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffcc00;
            --neon-green: #39ff14;
            --neon-red: #ff3333;
            --glass-bg: rgba(10, 16, 26, 0.90);
            --glass-border: rgba(0, 243, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); height: 100vh; overflow: hidden; color: #fff; }

        #map-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #map { width: 100%; height: 100%; }

        /* PANEL SUPERIOR DE ESTADO */
        .top-card {
            position: absolute; top: env(safe-area-inset-top, 16px); left: 16px; right: 16px;
            z-index: 1000; background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 12px 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: space-between;
        }

        .switch-container { display: flex; align-items: center; gap: 10px; }
        
        .status-dot {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red);
            transition: 0.3s;
        }
        .status-dot.online {
            background: var(--neon-green); box-shadow: 0 0 15px var(--neon-green);
        }

        .btn-toggle-online {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 12px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-toggle-online.active {
            background: rgba(57, 255, 20, 0.15); border-color: var(--neon-green); color: var(--neon-green);
        }

        .btn-sentido-driver {
            background: linear-gradient(135deg, var(--neon-yellow) 0%, #ff9900 100%);
            border: none; padding: 8px 16px; border-radius: 12px;
            font-weight: 900; font-size: 12px; color: #000; cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        /* TARJETA DE RESERVAS ENTRANTES (INFERIOR) */
        .bottom-card {
            position: absolute; bottom: env(safe-area-inset-bottom, 20px); left: 16px; right: 16px;
            z-index: 1000; background: var(--glass-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--neon-cyan); border-radius: 24px;
            padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: none;
        }

        .reserva-title { font-size: 11px; font-weight: 800; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .reserva-pasajero { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 4px; }
        .reserva-detalle { font-size: 13px; color: #a0b0c0; margin-bottom: 12px; font-weight: 700; }
        .reserva-detalle span { color: var(--neon-yellow); }

        .btn-accion {
            width: 100%; background: linear-gradient(135deg, var(--neon-green) 0%, #208d13 100%);
            color: #000; border: none; padding: 12px; border-radius: 14px;
            font-size: 14px; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
    </style>
</head>
<body>

    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <!-- PANEL SUPERIOR -->
    <div class="top-card">
        <div class="switch-container">
            <div id="dot-estado" class="status-dot"></div>
            <button id="btn-estado" class="btn-toggle-online" onclick="toggleOnline()">DESCONECTADO</button>
        </div>
        <button id="btn-sentido" class="btn-sentido-driver" onclick="cambiarSentidoDriver()">IDA</button>
    </div>

    <!-- TARJETA DE VIAJE ENTRANTE -->
    <div id="card-reserva" class="bottom-card">
        <div class="reserva-title" id="txt-titulo-estado">🚨 ¡Nueva Solicitud de Pasajero!</div>
        <div id="txt-nombre-pax" class="reserva-pasajero">Cargando...</div>
        <div id="txt-ruta-pax" class="reserva-detalle">Destino: -</div>
        <div id="txt-asientos-pax" class="reserva-detalle" style="margin-bottom: 12px;">Asientos: 1</div>
        <button id="btn-accion-viaje" class="btn-accion" onclick="atenderOFinalizarViaje()">ATENDER SOLICITUD</button>
    </div>

    <!-- Scripts CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://nvumdlxervrewqiiaicl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oVmiLSfe_AJ5iDpeAXIukA_CLdHuwkE';
        const _s = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const miIdMovil = 1; // Coche #1
        let map, marcadorChofer = null;
        let estaOnline = false;
        let sentidoDriver = 'IDA';
        let idReservaActual = null;
        let estadoViajeActual = 'en_curso'; // 'en_curso' o 'a_bordo'
        let watchId = null;
        let ultimaReservaID = null;

        const paradas = [
            { id: 1, n: 'Av. Derqui y P197 (Cruce Derqui)', c: [-34.537898, -58.794848] },
            { id: 2, n: 'Fray Antonio Marchena y Carlos Eberth', c: [-34.539274, -58.793441] },
            { id: 3, n: 'Fray Antonio Marchena y Descartes', c: [-34.540553, -58.792168] },
            { id: 4, n: 'Av. Derqui y Gral. Juan Lavalle', c: [-34.541319, -58.791487] },
            { id: 5, n: 'Av. Derqui y José C. Paz', c: [-34.542679, -58.790175] },
            { id: 6, n: 'Av. Derqui y Av. José Altuve', c: [-34.544123, -58.788772] },
            { id: 7, n: 'Av. Derqui y Dr. Enrique Finochietto', c: [-34.545472, -58.787421] },
            { id: 8, n: 'Universidad Tecnológica Robotics', c: [-34.548500, -58.784200] },
            { id: 9, n: 'Parque Industrial', c: [-34.552000, -58.780800] },
            { id: 10, n: 'Base Aérea (Entrada Cuartel V)', c: [-34.555000, -58.778000] },
            { id: 11, n: 'Av. Derqui y C. Bartolomé Hidalgo', c: [-34.557029, -58.776122] },
            { id: 12, n: 'Fray Antonio Marchena y Pedro de Mendoza', c: [-34.558350, -58.774500] },
            { id: 13, n: 'Fray Antonio Marchena y Marcos Paz', c: [-34.559853, -58.772330] },
            { id: 14, n: 'Fray Antonio Marchena y Miguel Cané', c: [-34.561176, -58.770641] },
            { id: 15, n: 'Los Aromos y Santander', c: [-34.562495, -58.772093] },
            { id: 16, n: 'Los Aromos y Murillo', c: [-34.564006, -58.773679] },
            { id: 17, n: 'Murillo y Moctezuma', c: [-34.565289, -58.772213] },
            { id: 18, n: 'Murillo y Güiraldes', c: [-34.567268, -58.769484] },
            { id: 19, n: 'Murillo y Watt', c: [-34.569090, -58.767095] },
            { id: 20, n: 'A. Prado 2555', c: [-34.571016, -58.764443] },
            { id: 21, n: 'Prado y Payró', c: [-34.571956, -58.763201] },
            { id: 22, n: 'Prado 1744', c: [-34.577371, -58.755909] },
            { id: 23, n: 'Boulevard Caveri', c: [-34.578528, -58.757064] },
            { id: 24, n: 'Caveri y Azara', c: [-34.579296, -58.755864] },
            { id: 25, n: 'Caveri y Vedia', c: [-34.580020, -58.755063] },
            { id: 26, n: 'Caveri y Tablada', c: [-34.580901, -58.753842] },
            { id: 27, n: 'Caveri y Echeverría', c: [-34.581998, -58.752441] },
            { id: 28, n: 'Caveri y Gálvez', c: [-34.583319, -58.750710] },
            { id: 29, n: 'Caveri (Final)', c: [-34.584740, -58.748804] },
            { id: 30, n: 'Libertador y Aero', c: [-34.585554, -58.749812] },
            { id: 31, n: 'Libertador 7300', c: [-34.586494, -58.750574] },
            { id: 32, n: 'Libertador 7200', c: [-34.588041, -58.751542] },
            { id: 33, n: 'Libertador y Maza', c: [-34.588273, -58.751338] },
            { id: 34, n: 'Maza y Albatros', c: [-34.588771, -58.750804] },
            { id: 35, n: 'Maternidad', c: [-34.588244, -58.749877] },
            { id: 36, n: 'Abasto y Roca', c: [-34.586030, -58.747278] }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            map = L.map('map', { zoomControl: false }).setView(paradas[0].c, 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Dibujar todas las paradas en el mapa del chofer
            paradas.forEach((p) => {
                L.circleMarker(p.c, {
                    radius: 7, color: '#000', weight: 2,
                    fillColor: '#00f3ff', fillOpacity: 0.9
                }).addTo(map).bindPopup(`<b>Parada:</b> ${p.n}`);
            });

            setInterval(verificarReservasEntrantes, 3000);
        });

        // Reproducir sonido de alarma pitido corto
        function sonarAlarma() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880; // Tono agudo
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.log("Audio bloqueado por navegador hasta interacción");
            }
        }

        function toggleOnline() {
            estaOnline = !estaOnline;
            const dot = document.getElementById('dot-estado');
            const btn = document.getElementById('btn-estado');

            if (estaOnline) {
                dot.classList.add('online');
                btn.classList.add('active');
                btn.innerText = "EN LÍNEA";
                iniciarGPSChofer();
            } else {
                dot.classList.remove('online');
                btn.classList.remove('active');
                btn.innerText = "DESCONECTADO";
                detenerGPSChofer();
                actualizarEstadoSupabase(false);
            }
        }

        function cambiarSentidoDriver() {
            sentidoDriver = (sentidoDriver === 'IDA') ? 'VUELTA' : 'IDA';
            document.getElementById('btn-sentido').innerText = sentidoDriver;
            if (estaOnline) {
                actualizarPosicionSupabase(-34.537898, -58.794848);
            }
        }

        function iniciarGPSChofer() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;

                    if (!marcadorChofer) {
                        marcadorChofer = L.marker([lat, lon], {
                            icon: L.divIcon({
                                className: 'custom-driver-marker',
                                html: '<div style="background:#00f3ff; width:18px; height:18px; border-radius:50%; border:3px solid #000; box-shadow:0 0 12px #00f3ff;"></div>',
                                iconSize: [18, 18]
                            })
                        }).addTo(map);
                    } else {
                        marcadorChofer.setLatLng([lat, lon]);
                    }

                    map.panTo([lat, lon]);
                    actualizarPosicionSupabase(lat, lon);

                }, (err) => {
                    console.error("Error GPS:", err);
                }, { enableHighAccuracy: true });
            }
        }

        function detenerGPSChofer() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }

        async function actualizarPosicionSupabase(lat, lon) {
            await _s.from('estado_movil').upsert({
                id: miIdMovil,
                chofer: 'Chofer Coche 1',
                esta_online: estaOnline,
                latitud: lat,
                longitud: lon,
                sentido_flujo: sentidoDriver,
                updated_at: new Date()
            });
        }

        async function actualizarEstadoSupabase(online) {
            await _s.from('estado_movil').upsert({
                id: miIdMovil,
                esta_online: online,
                sentido_flujo: sentidoDriver,
                updated_at: new Date()
            });
        }

        async function verificarReservasEntrantes() {
            if (!estaOnline) return;

            try {
                const { data: reservas, error } = await _s
                    .from('reservas_activas')
                    .select('*')
                    .eq('id_movil', miIdMovil)
                    .in('estado', ['en_curso', 'a_bordo'])
                    .limit(1);

                if (error) throw error;

                const card = document.getElementById('card-reserva');

                if (reservas && reservas.length > 0) {
                    const r = reservas[0];
                    idReservaActual = r.id;
                    estadoViajeActual = r.estado;

                    // Si es una solicitud nueva que no habíamos visto, suena la alarma
                    if (ultimaReservaID !== r.id && r.estado === 'en_curso') {
                        ultimaReservaID = r.id;
                        sonarAlarma();
                    }

                    document.getElementById('txt-nombre-pax').innerText = `👤 ${r.nombre_pasajero}`;
                    document.getElementById('txt-ruta-pax').innerHTML = `Destino: <span>${r.destino}</span>`;
                    document.getElementById('txt-asientos-pax').innerText = `Asientos solicitados: ${r.asientos} (${r.sentido})`;

                    const btnAccion = document.getElementById('btn-accion-viaje');
                    const txtTitulo = document.getElementById('txt-titulo-estado');

                    if (r.estado === 'en_curso') {
                        txtTitulo.innerText = "🚨 ¡Nueva Solicitud de Pasajero!";
                        btnAccion.innerText = "ATENDER SOLICITUD (PASAJERO A BORDO)";
                    } else if (r.estado === 'a_bordo') {
                        txtTitulo.innerText = "🚗 Pasajero a bordo en viaje";
                        btnAccion.innerText = "FINALIZAR / LIBERAR VIAJE";
                    }
                    
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                    idReservaActual = null;
                    ultimaReservaID = null;
                }
            } catch (e) {
                console.error("Error consultando reservas:", e);
            }
        }

        async function atenderOFinalizarViaje() {
            if (!idReservaActual) return;

            try {
                if (estadoViajeActual === 'en_curso') {
                    // Cambiar estado a 'a_bordo' cuando el chofer atiende y sube al pasajero
                    await _s
                        .from('reservas_activas')
                        .update({ estado: 'a_bordo' })
                        .eq('id', idReservaActual);

                    estadoViajeActual = 'a_bordo';
                    alert("¡Solicitud atendida! Pasajero a bordo.");
                } else {
                    // Finalizar y eliminar de activas
                    await _s
                        .from('reservas_activas')
                        .update({ estado: 'finalizado' })
                        .eq('id', idReservaActual);

                    document.getElementById('card-reserva').style.display = 'none';
                    idReservaActual = null;
                    ultimaReservaID = null;
                    alert("¡Viaje finalizado con éxito! El móvil queda libre.");
                }
            } catch (e) {
                console.error("Error al actualizar viaje:", e);
            }
        }
    </script>
</body>
</html>
