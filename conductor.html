<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Chofer - Tu Móvil Oficial PRO</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ESTILOS FUTURISTAS -->
    <style>
        :root {
            --bg-dark: #05070a;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffcc00;
            --neon-green: #39ff14;
            --neon-red: #ff0055;
            --glass-bg: rgba(10, 16, 26, 0.88);
            --glass-border: rgba(0, 243, 255, 0.25);
            --glass-glow: rgba(0, 243, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); height: 100vh; overflow: hidden; color: #fff; }

        /* SPLASH SCREEN INICIAL */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a3e 0%, #05050f 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999; transition: opacity 0.6s ease, visibility 0.6s;
        }
        .logo-ring {
            width: 120px; height: 120px; border: 3px solid var(--neon-cyan); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3); animation: pulseRing 2s infinite;
        }
        @keyframes pulseRing { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        #splash h1 { color: var(--neon-cyan); margin-top: 20px; font-size: 26px; letter-spacing: 3px; font-weight: 800; }
        #splash p { color: #888; margin-top: 6px; font-size: 13px; }
        .loading-bar { width: 140px; height: 3px; background: #222; border-radius: 3px; margin-top: 20px; overflow: hidden; }
        .loading-bar-inner { width: 0%; height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-yellow)); animation: loadBar 1.5s ease forwards; }
        @keyframes loadBar { to { width: 100%; } }

        /* MODAL DE CONFIGURACIÓN PREVIA */
        #modal-config {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.94); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9998; padding: 20px; display: none;
        }
        .config-card {
            background: var(--glass-bg); border: 2px solid var(--neon-cyan);
            border-radius: 28px; padding: 24px; width: 100%; max-width: 380px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.25); text-align: center;
        }
        .config-card h2 { color: var(--neon-cyan); font-size: 18px; margin-bottom: 6px; font-weight: 900; }
        .config-card p { color: #8a99ad; font-size: 12px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { font-size: 10px; font-weight: 800; color: var(--neon-yellow); letter-spacing: 1px; display: block; margin-bottom: 4px; text-transform: uppercase; }
        .form-control {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
            padding: 12px; border-radius: 14px; color: #fff; font-size: 14px; outline: none;
        }
        .form-control:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,243,255,0.3); }
        .btn-guardar-config {
            background: linear-gradient(135deg, var(--neon-cyan) 0%, #0088cc 100%);
            color: #000; border: none; width: 100%; padding: 14px; border-radius: 16px;
            font-weight: 900; font-size: 15px; cursor: pointer; margin-top: 10px;
            box-shadow: 0 0 20px rgba(0,243,255,0.4);
        }

        /* MAPA Y CAPAS */
        #map-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; overflow: hidden; filter: contrast(1.05) brightness(0.95);
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* ETIQUETAS PERMANENTES */
        .leaflet-tooltip.etiqueta-baja { 
            background: #ffffff !important; color: #000000 !important; border: 2px solid var(--neon-cyan) !important; 
            font-weight: 800 !important; font-size: 11px !important; border-radius: 8px !important; box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;
        }
        .leaflet-tooltip.etiqueta-sube { 
            background: var(--neon-yellow) !important; color: #000000 !important; border: 2px solid var(--neon-red) !important; 
            font-weight: 800 !important; font-size: 11px !important; border-radius: 8px !important; box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;
        }

        /* HEADER & CONTROL FLOTANTE */
        .top-nav {
            position: absolute; top: env(safe-area-inset-top, 12px); left: 12px; right: 12px;
            z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .header-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), inset 0 0 15px var(--glass-glow);
        }

        .connection-status { display: flex; align-items: center; gap: 10px; }
        #status-label { font-size: 10px; font-weight: 900; letter-spacing: 1.5px; color: #8a99ad; text-transform: uppercase; }

        .switch { position: relative; width: 48px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: #16202c; border-radius: 24px; transition: .4s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 2px;
            background: #7a8b9e; border-radius: 50%; transition: .4s;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        input:checked + .slider { background: rgba(57, 255, 20, 0.2); border-color: var(--neon-green); }
        input:checked + .slider:before { transform: translateX(23px); background: var(--neon-green); box-shadow: 0 0 12px var(--neon-green); }

        .header-right-controls { display: flex; align-items: center; gap: 8px; }

        .recaudacion-flotante-box {
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--neon-green);
            padding: 5px 12px; border-radius: 14px;
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 900; color: var(--neon-green);
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.2);
        }

        .speed-box-top {
            display: flex; align-items: center; justify-content: center; gap: 3px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            padding: 5px 12px; border-radius: 14px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
        }
        .speed-box-top #txt-velocidad { font-size: 15px; font-weight: 900; color: #fff; text-shadow: 0 0 8px var(--neon-cyan); }
        .speed-box-top .speed-unit { font-size: 8px; color: var(--neon-cyan); font-weight: 900; }

        #btn-sentido {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            border: none; padding: 7px 14px; border-radius: 14px;
            font-weight: 900; font-size: 11px; color: #000; cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.3); transition: transform 0.2s;
        }
        #btn-sentido:active { transform: scale(0.94); }

        /* BOTONES FLOTANTES */
        .btn-flotante-grupo { position: absolute; bottom: 92px; right: 18px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
        .btn-floating-action {
            background: linear-gradient(135deg, var(--neon-yellow) 0%, #ff9900 100%);
            color: #000; border: none; width: 50px; height: 50px;
            border-radius: 50%; font-size: 20px; font-weight: bold; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4);
            cursor: pointer; pointer-events: auto; transition: transform 0.2s;
        }
        .btn-floating-action:active { transform: scale(0.9); }

        /* ASIENTOS / COCKPIT BAR */
        .bar-asientos-fija {
            position: absolute; bottom: env(safe-area-inset-bottom, 14px); left: 12px; right: 12px; z-index: 998;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 8px; display: flex; gap: 8px; pointer-events: auto;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8), inset 0 0 15px var(--glass-glow);
        }
        .pill {
            flex: 1; height: 54px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 800; color: #617388; cursor: pointer; padding: 4px; transition: all 0.3s ease;
        }
        .pill .seat-num { font-size: 13px; color: #495869; font-weight: 900; }
        .pill .nombre-pax { font-size: 10px; color: #fff; font-weight: 800; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pill .destino-pax { font-size: 8px; color: var(--neon-yellow); font-weight: 700; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .pill.active {
            background: rgba(255, 204, 0, 0.12);
            border-color: var(--neon-yellow);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.25);
        }
        .pill.active .destino-pax { color: var(--neon-yellow); }

        .pill.a-bordo {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        .pill.a-bordo .seat-num, .pill.a-bordo .nombre-pax { color: #fff; text-shadow: 0 0 6px var(--neon-cyan); }
        .pill.a-bordo .destino-pax { color: var(--neon-cyan); }

        /* BOTTOM SHEET OPERATIVO */
        .bottom-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 1001;
            background: rgba(8, 12, 18, 0.96);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--neon-cyan); border-radius: 32px 32px 0 0;
            padding: 16px 20px env(safe-area-inset-bottom, 24px) 20px; max-height: 80vh; overflow-y: auto;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto;
            box-shadow: 0 -10px 40px rgba(0, 243, 255, 0.15);
        }
        .bottom-sheet.expanded { transform: translateY(0%); }
        .drag-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto 16px auto; cursor: pointer; }

        .sheet-stats-grid { display: flex; gap: 12px; margin-bottom: 16px; }
        .q-stat {
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 20px;
            flex: 1; border: 1px solid rgba(255,255,255,0.06); text-align: center;
        }
        .q-label { font-size: 9px; color: #76889b; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        .q-value { font-size: 24px; font-weight: 900; margin-top: 4px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }

        .action-group { display: flex; flex-direction: column; gap: 10px; }
        .btn-action { width: 100%; border: none; padding: 16px; border-radius: 18px; font-weight: 900; font-size: 15px; cursor: pointer; display: none; }
        .btn-vaciar { background: rgba(255, 0, 85, 0.08); color: var(--neon-red); border: 1px solid rgba(255, 0, 85, 0.3); display: block; padding: 12px; font-size: 13px; }
        .btn-finalizar-jornada { display: block !important; background: linear-gradient(135deg, #d31027 0%, #ea384d 100%); color: #fff; margin-top: 6px; box-shadow: 0 4px 15px rgba(234, 56, 77, 0.3); }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN DE CARGA -->
    <div id="splash">
        <div class="logo-ring"><span style="font-size: 45px;">🚕</span></div>
        <h1>TUMOVIL</h1>
        <p>Conductor Oficial PRO</p>
        <div class="loading-bar"><div class="loading-bar-inner"></div></div>
    </div>

    <!-- MODAL DE CONFIGURACIÓN PRE-CONEXIÓN -->
    <div id="modal-config">
        <div class="config-card">
            <h2>⚙️ IDENTIFICACIÓN DEL CHOFER</h2>
            <p>Ingresa tus datos y confirma tu horario para entrar en línea.</p>
            
            <div class="form-group">
                <label>Nombre, Vehículo y Patente</label>
                <input type="text" id="input-nombre-chofer" class="form-control" placeholder="Ej: Carlos Cuevas - Ford Fiesta (JCP 478)">
            </div>

            <button class="btn-guardar-config" onclick="guardarConfiguracionYEntrar()">CONFIRMAR Y GUARDAR</button>
        </div>
    </div>

    <!-- Controles Superiores -->
    <div class="top-nav">
        <div class="header-bar">
            <div class="connection-status">
                <label class="switch">
                    <input type="checkbox" id="online-toggle" onchange="gestionarConexion()">
                    <span class="slider"></span>
                </label>
                <span id="status-label">DESCONECTADO</span>
            </div>

            <div class="header-right-controls">
                <div class="recaudacion-flotante-box">
                    <span>💵</span> <span id="txt-plata">$0</span>
                </div>
                <div class="speed-box-top">
                    <span id="txt-velocidad">0</span>
                    <span class="speed-unit">KM/H</span>
                </div>
                <button id="btn-sentido" onclick="cambiarSentido()">IDA</button>
            </div>
        </div>
    </div>

    <!-- Mapa -->
    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <div class="btn-flotante-grupo">
        <button class="btn-floating-action" onclick="abrirConfiguracion()" title="Configurar Datos">⚙️</button>
        <button class="btn-floating-action" onclick="abrirSheet()" title="Menú Operativo">☰</button>
    </div>

    <!-- Asientos / Cockpit Bar -->
    <div class="bar-asientos-fija">
        <div id="pill1" class="pill" onclick="gestionarAsiento(1)"><span class="seat-num">1</span><span id="nombre-pax-1" class="nombre-pax">Libre</span><span id="destino-pax-1" class="destino-pax">-</span></div>
        <div id="pill2" class="pill" onclick="gestionarAsiento(2)"><span class="seat-num">2</span><span id="nombre-pax-2" class="nombre-pax">Libre</span><span id="destino-pax-2" class="destino-pax">-</span></div>
        <div id="pill3" class="pill" onclick="gestionarAsiento(3)"><span class="seat-num">3</span><span id="nombre-pax-3" class="nombre-pax">Libre</span><span id="destino-pax-3" class="destino-pax">-</span></div>
        <div id="pill4" class="pill" onclick="gestionarAsiento(4)"><span class="seat-num">4</span><span id="nombre-pax-4" class="nombre-pax">Libre</span><span id="destino-pax-4" class="destino-pax">-</span></div>
    </div>

    <!-- Panel Inferior -->
    <div id="driver-sheet" class="bottom-sheet">
        <div class="drag-handle" onclick="cerrarSheet()"></div>
        <div class="sheet-stats-grid">
            <div class="q-stat"><div class="q-label">Pasajeros</div><div id="txt-pax" class="q-value">0</div></div>
            <div class="q-stat"><div class="q-label">Próxima Parada</div><div id="txt-parada" class="q-value" style="font-size: 13px; font-weight: 800; margin-top: 6px;">En línea</div></div>
        </div>
        <div class="action-group">
            <button class="btn-action btn-vaciar" onclick="confirmarVaciar()">🧹 Vaciar Todos los Asientos</button>
            <button class="btn-action btn-finalizar-jornada" onclick="finalizarJornada()">🔴 Finalizar Jornada Laboral</button>
        </div>
    </div>

    <!-- ENLACE AL SCRIPT EXTERNO -->
    <script src="driver.js"></script>
</body>
</html>
