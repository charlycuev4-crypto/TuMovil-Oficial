<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Chofer - Tu Móvil</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- ESTILOS FUTURISTAS UNIFICADOS -->
    <style>
        :root {
            --bg-dark: #05070a;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffcc00;
            --neon-green: #39ff14;
            --neon-red: #ff0055;
            --glass-bg: rgba(10, 16, 26, 0.75);
            --glass-border: rgba(0, 243, 255, 0.25);
            --glass-glow: rgba(0, 243, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); height: 100vh; overflow: hidden; color: #fff; }

        /* MAPA Y CAPAS */
        #map-wrapper {
            position: absolute; top: -30%; left: -30%; width: 160%; height: 160%;
            z-index: 1; overflow: hidden; transform-origin: center center;
            filter: contrast(1.05) brightness(0.95);
        }
        #map { width: 100%; height: 100%; }

        /* HEADER & CONTROL FLOTANTE FUTURISTA */
        .top-nav {
            position: absolute; top: env(safe-area-inset-top, 12px); left: 12px; right: 12px;
            z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .header-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), inset 0 0 15px var(--glass-glow);
        }

        .connection-status { display: flex; align-items: center; gap: 10px; }
        #status-label { font-size: 10px; font-weight: 900; letter-spacing: 1.5px; color: #8a99ad; text-transform: uppercase; }

        .switch { position: relative; width: 48px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background: #16202c; border-radius: 24px; transition: .4s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 2px;
            background: #7a8b9e; border-radius: 50%; transition: .4s;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        input:checked + .slider { background: rgba(57, 255, 20, 0.2); border-color: var(--neon-green); }
        input:checked + .slider:before { transform: translateX(23px); background: var(--neon-green); box-shadow: 0 0 12px var(--neon-green); }

        .header-right-controls { display: flex; align-items: center; gap: 8px; }

        .recaudacion-flotante-box {
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--neon-green);
            padding: 5px 12px; border-radius: 14px;
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 900; color: var(--neon-green);
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.2);
        }

        .speed-box-top {
            display: flex; align-items: center; justify-content: center; gap: 3px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            padding: 5px 12px; border-radius: 14px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
        }
        .speed-box-top #txt-velocidad { font-size: 15px; font-weight: 900; color: #fff; text-shadow: 0 0 8px var(--neon-cyan); }
        .speed-box-top .speed-unit { font-size: 8px; color: var(--neon-cyan); font-weight: 900; }

        #btn-sentido {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            border: none; padding: 7px 14px; border-radius: 14px;
            font-weight: 900; font-size: 11px; color: #000; cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.3); transition: transform 0.2s, box-shadow 0.2s;
        }
        #btn-sentido:active { transform: scale(0.94); }

        /* BOTÓN FLOTANTE MENÚ */
        #btn-abrir-sheet {
            position: absolute; bottom: 92px; right: 18px; z-index: 999;
            background: linear-gradient(135deg, var(--neon-yellow) 0%, #ff9900 100%);
            color: #000; border: none; width: 56px; height: 56px;
            border-radius: 50%; font-size: 24px; font-weight: bold; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4), 0 0 15px rgba(255, 204, 0, 0.2);
            cursor: pointer; pointer-events: auto; transition: transform 0.2s;
        }
        #btn-abrir-sheet:active { transform: scale(0.9); }

        /* ASIENTOS FUTURISTAS (COCKPIT BAR) */
        .bar-asientos-fija {
            position: absolute; bottom: env(safe-area-inset-bottom, 14px); left: 12px; right: 12px; z-index: 998;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 8px; display: flex; gap: 8px; pointer-events: auto;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8), inset 0 0 15px var(--glass-glow);
        }
        .pill {
            flex: 1; height: 54px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 800; color: #617388; cursor: pointer; padding: 4px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pill .seat-num { font-size: 13px; color: #495869; font-weight: 900; }
        .pill .nombre-pax { font-size: 10px; color: #fff; font-weight: 800; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pill .destino-pax { font-size: 8px; color: var(--neon-yellow); font-weight: 700; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .pill.active {
            background: rgba(255, 204, 0, 0.1);
            border-color: var(--neon-yellow);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.2);
        }
        .pill.a-bordo {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.25) 0%, rgba(0, 136, 204, 0.35) 100%);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        .pill.a-bordo .seat-num, .pill.a-bordo .nombre-pax { color: #fff; text-shadow: 0 0 6px var(--neon-cyan); }
        .pill.a-bordo .destino-pax { color: var(--neon-yellow); }

        /* BOTTOM SHEET OPERATIVO */
        .bottom-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 1001;
            background: rgba(8, 12, 18, 0.96);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--neon-cyan); border-radius: 32px 32px 0 0;
            padding: 16px 20px env(safe-area-inset-bottom, 24px) 20px; max-height: 80vh; overflow-y: auto;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto;
            box-shadow: 0 -10px 40px rgba(0, 243, 255, 0.15);
        }
        .bottom-sheet.expanded { transform: translateY(0%); }
        .drag-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto 16px auto; cursor: pointer; }

        .sheet-stats-grid { display: flex; gap: 12px; margin-bottom: 16px; }
        .q-stat {
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 20px;
            flex: 1; border: 1px solid rgba(255,255,255,0.06); text-align: center;
        }
        .q-label { font-size: 9px; color: #76889b; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        .q-value { font-size: 24px; font-weight: 900; margin-top: 4px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }

        .action-group { display: flex; flex-direction: column; gap: 10px; }
        .btn-action { width: 100%; border: none; padding: 16px; border-radius: 18px; font-weight: 900; font-size: 15px; cursor: pointer; display: block; transition: transform 0.2s; }
        .btn-action:active { transform: scale(0.97); }
        .btn-vaciar { background: rgba(255, 0, 85, 0.08); color: var(--neon-red); border: 1px solid rgba(255, 0, 85, 0.3); padding: 12px; font-size: 13px; margin-top: 4px; }
        .btn-finalizar-jornada { background: linear-gradient(135deg, #d31027 0%, #ea384d 100%); color: #fff; margin-top: 6px; box-shadow: 0 4px 15px rgba(234, 56, 77, 0.3); }

        /* ALERTA DE RESERVA FLOTANTE FUTURISTA */
        .alerta-reserva {
            position: fixed; top: 20px; left: 16px; right: 16px;
            background: rgba(8, 12, 18, 0.98); border: 2px solid var(--neon-yellow);
            border-radius: 24px; color: white; padding: 20px; text-align: center;
            z-index: 10000; transform: translateY(-150%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.4);
        }
        .alerta-reserva.mostrar { transform: translateY(0); }
        .alerta-reserva h2 { color: var(--neon-yellow); font-size: 16px; margin-bottom: 6px; font-weight: 900; }
        .alerta-reserva p { font-size: 13px; color: #fff; margin-bottom: 14px; line-height: 1.4; }
        .alerta-botones { display: flex; gap: 10px; }
        .btn-atender {
            background: linear-gradient(135deg, var(--neon-green) 0%, #208d13 100%);
            color: #000; border: none; padding: 12px 10px; border-radius: 14px;
            font-weight: 900; font-size: 14px; cursor: pointer; flex: 1;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
        .btn-rechazar {
            background: rgba(255, 0, 85, 0.1); color: var(--neon-red);
            border: 1px solid rgba(255, 0, 85, 0.4); padding: 12px 10px; border-radius: 14px;
            font-weight: 900; font-size: 13px; cursor: pointer; flex: 1;
        }

        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 8, 0.95); backdrop-filter: blur(25px);
            display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 20px;
        }
        .login-card {
            background: rgba(14, 20, 30, 0.9); border: 1px solid var(--neon-cyan);
            width: 100%; max-width: 380px; padding: 28px; border-radius: 28px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.2); text-align: center;
        }
        .login-card h2 { color: var(--neon-cyan); font-size: 22px; font-weight: 900; margin-bottom: 8px; text-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
        .login-card p { color: #76889b; font-size: 13px; margin-bottom: 22px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 11px; font-weight: 800; color: #a0b0c0; margin-bottom: 6px; letter-spacing: 0.5px; }
        .form-group input {
            width: 100%; background: #080d14; border: 1px solid rgba(0, 243, 255, 0.2); padding: 14px;
            border-radius: 16px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(0, 243, 255, 0.3); }
        .btn-ingresar {
            width: 100%; background: linear-gradient(135deg, var(--neon-cyan) 0%, #0088cc 100%);
            color: #000; border: none; padding: 16px; border-radius: 16px; font-weight: 900;
            font-size: 16px; cursor: pointer; margin-top: 10px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
    </style>
</head>
<body>

            </div>

            <div class="form-group">
                <label>Patente / Dominio</label>
                <input type="text" id="input-patente" placeholder="Ej: JCP 478" />
            </div>

            <div class="form-group">
                <label>Modelo y Color del Auto</label>
                <input type="text" id="input-auto" placeholder="Ej: Ford Fiesta Negro" />
            </div>

            <button class="btn-ingresar" onclick="guardarDatosChofer()">Comenzar a Trabajar</button>

            <button class="btn-atender" onclick="atenderSolicitud()">ATENDER Y ACEPTAR</button>
        </div>
    </div>

        // SISTEMA DE ANUNCIOS DE PARADAS
        let indiceParadaActual = 0;

        const RADIO_LLEGADA = 45;

        function indiceSiguiente(i) {
            return sentidoFlujo === 'IDA' ? (i + 1) % paradas.length : (i - 1 + paradas.length) % paradas.length;
        }
        function indiceAnterior(i) {
            return sentidoFlujo === 'IDA' ? (i - 1 + paradas.length) % paradas.length : (i + 1) % paradas.length;
        }

        function anunciar(texto) {
            try {
                if (!window.speechSynthesis) return;
                speechSynthesis.cancel();
                const voz = new SpeechSynthesisUtterance(texto);
                voz.lang = 'es-ES';
                voz.rate = 1;
                voz.pitch = 1;
                const voces = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('es'));

        }

        function procesarAnunciosParadas(lat, lon) {
            if (!paradas.length || !map) return;
            let idxCercana = 0, distMin = Infinity;
            const miPos = L.latLng(lat, lon);
            for (let i = 0; i < paradas.length; i++) {
                const d = map.distance(miPos, paradas[i].c);
                if (d < distMin) { distMin = d; idxCercana = i; }
            }

            if (!anunciosIniciados) {
                anunciosIniciados = true;
                indiceParadaActual = idxCercana;
                ultimaLlegadaIdx = idxCercana;
                const sig = indiceSiguiente(indiceParadaActual);
                anunciar('Próxima parada: ' + paradas[sig].n);
            }

            const esperada = indiceSiguiente(indiceParadaActual);
            if (idxCercana === esperada && distMin < RADIO_LLEGADA) {
                if (ultimaLlegadaIdx !== idxCercana) {
                    ultimaLlegadaIdx = idxCercana;
                    indiceParadaActual = idxCercana;
                    anunciar('Hemos llegado a ' + paradas[idxCercana].n);
                    const sig = indiceSiguiente(indiceParadaActual);
                    setTimeout(() => anunciar('Próxima parada: ' + paradas[sig].n), 2600);
                }
            } else if (idxCercana !== indiceParadaActual && idxCercana !== esperada) {
                indiceParadaActual = indiceAnterior(idxCercana);
                ultimaLlegadaIdx = -1;
            }

            const sig = indiceSiguiente(indiceParadaActual);
            const dSig = map.distance(miPos, paradas[sig].c);
            const elParada = document.getElementById('txt-parada');
            if (elParada) elParada.innerText = paradas[sig].n + ' · ' + Math.round(dSig) + 'm';
        }

        function reiniciarAnuncios() {
            anunciosIniciados = false;
            ultimaLlegadaIdx = -1;
        }

        // AUTO HOLOGRÁFICO 3D

            const colorVelocidad = velocidad > 50 ? '#ff0055' : velocidad > 30 ? '#ffcc00' : '#00f3ff';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="50" height="75">
                <defs>
                    <linearGradient id="carBodyG" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#FFFACD;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
                    </linearGradient>
                    <filter id="neonGlow">
                        <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>

                    </ellipse>
                </g>
                <ellipse cx="60" cy="30" rx="20" ry="15" fill="${colorVelocidad}" opacity="0.15" filter="url(#neonGlow)"/>
                <g transform="translate(30,40)">
                    <ellipse cx="30" cy="85" rx="25" ry="10" fill="#000" opacity="0.3"/>
                    <path d="M5,20 L55,20 L60,80 L0,80 Z" fill="url(#carBodyG)" stroke="#000" stroke-width="1"/>
                    <path d="M12,25 L48,25 L52,55 L8,55 Z" fill="#1a1a1a" stroke="#000" stroke-width="1"/>

        window.addEventListener('DOMContentLoaded', () => {
            inicializarMapa();

            const guardado = localStorage.getItem('chofer_datos');
            if (guardado) {
                datosChofer = JSON.parse(guardado);
                document.getElementById('login-overlay').style.display = 'none';
            }

            if (window.speechSynthesis) {
                speechSynthesis.getVoices();
                speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
            }

            setInterval(escucharReservas, 3000);
        });

        function inicializarMapa() {
            map = L.map('map', { zoomControl: false }).setView(paradas[0].c, 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            paradas.forEach((p) => {
                L.circleMarker(p.c, {
                    radius: 6, color: '#000', weight: 2,
                    fillColor: '#00f3ff', fillOpacity: 0.9
                }).addTo(map).bindPopup(`<b>Parada:</b> ${p.n}`);
            });
        }

        function sonarAlarma() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {}
        }

        function guardarDatosChofer() {
            const nombre = document.getElementById('input-nombre').value.trim();
            const patente = document.getElementById('input-patente').value.trim();
            const auto = document.getElementById('input-auto').value.trim();

            if (!nombre || !patente) {
                alert("Por favor completa tu Nombre y Patente.");
                return;
            }

            datosChofer = { nombre, patente, auto };
            localStorage.setItem('chofer_datos', JSON.stringify(datosChofer));
            document.getElementById('login-overlay').style.display = 'none';
        }

        function gestionarConexion() {
            const chk = document.getElementById('online-toggle');
            const lbl = document.getElementById('status-label');
            estaOnline = chk.checked;

            if (estaOnline) {
                lbl.innerText = "EN LÍNEA";
                lbl.style.color = "#39ff14";
                reiniciarAnuncios();
                iniciarGPS();
            } else {
                lbl.innerText = "DESCONECTADO";
                lbl.style.color = "#ff3333";
                detenerGPS();
                if (window.speechSynthesis) speechSynthesis.cancel();
                actualizarEstadoSupabase(false);
            }
        }

        function cambiarSentido() {
            sentidoFlujo = (sentidoFlujo === 'IDA') ? 'VUELTA' : 'IDA';
            document.getElementById('btn-sentido').innerText = sentidoFlujo;
            reiniciarAnuncios();
            if (estaOnline) {
                actualizarEstadoSupabase(true);
            }
        }

        function iniciarGPS() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const vel = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;

                    const txtVel = document.getElementById('txt-velocidad');
                    if (txtVel) txtVel.textContent = vel;

                    let nuevoIcono = L.icon({ iconUrl: crearIconoAuto(0, vel), iconSize: [50, 75], iconAnchor: [25, 37], className: 'auto-radar-icon' });

                    if (!marcadorChofer) {
                        marcadorChofer = L.marker([lat, lon], {
                            icon: nuevoIcono,
                            zIndexOffset: 1000
                        }).addTo(map);
                    } else {
                        marcadorChofer.setLatLng([lat, lon]);
                        marcadorChofer.setIcon(nuevoIcono);
                    }

                    map.panTo([lat, lon]);

                    if (estaOnline) procesarAnunciosParadas(lat, lon);
                    actualizarPosicionSupabase(lat, lon);
                }, (err) => console.error(err), { enableHighAccuracy: true });
            }
        }

        function detenerGPS() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }

        async function actualizarPosicionSupabase(lat, lon) {
            await _s.from('estado_movil').upsert({
                id: miIdMovil,
                chofer: datosChofer.nombre || 'Chofer 1',
                patente: datosChofer.patente || 'JCP 478',
                auto: datosChofer.auto || 'Fiesta',
                esta_online: estaOnline,
                latitud: lat,
                longitud: lon,
                sentido_flujo: sentidoFlujo,
                updated_at: new Date()
            });
        }

        async function actualizarEstadoSupabase(online) {
            await _s.from('estado_movil').upsert({
                id: miIdMovil,
                esta_online: online,
                sentido_flujo: sentidoFlujo,
                updated_at: new Date()
            });
        }

        async function escucharReservas() {
            if (!estaOnline) return;

            try {
                const { data: reservas, error } = await _s
                    .from('reservas_activas')
                    .select('*')
                    .eq('id_movil', miIdMovil)
                    .eq('estado', 'en_curso')
                    .limit(1);

                if (error) throw error;

                if (reservas && reservas.length > 0) {
                    const r = reservas[0];

                    if (ultimaReservaAlertaId !== r.id) {
                        ultimaReservaAlertaId = r.id;
                        reservaPendiente = r;

                        document.getElementById('alerta-texto').innerHTML = `
                            <b>Pasajero:</b> ${r.nombre_pasajero}<br>
                            <b>Ruta:</b> ${r.destino}<br>
                            <b>Asientos:</b> ${r.asientos}
                        `;

                        document.getElementById('alerta-reserva').classList.add('mostrar');
                        sonarAlarma();
                    }
                }
            } catch (e) {
                console.error("Error escuchando reservas:", e);
            }
        }

        function cerrarAlerta() {
            document.getElementById('alerta-reserva').classList.remove('mostrar');
        }

        async function atenderSolicitud() {
            if (!reservaPendiente) return;

            try {
                const numAsientosReq = parseInt(reservaPendiente.asientos) || 1;
                let asignados = 0;

                await _s
                    .from('reservas_activas')
                    .update({ 
                        estado: 'atendido',
                        chofer_nombre: datosChofer.nombre,
                        auto_modelo: datosChofer.auto,
                        patente: datosChofer.patente
                    })
                    .eq('id', reservaPendiente.id);

                for (let i = 1; i <= 4; i++) {
                    if (!asientos[i].ocupado && asignados < numAsientosReq) {
                        asientos[i].ocupado = true;
                        asientos[i].nombre = reservaPendiente.nombre_pasajero;
                        asientos[i].destino = reservaPendiente.destino;
                        asientos[i].idReserva = reservaPendiente.id;
                        asignados++;
                    }
                }

                actualizarPillsUI();
                cerrarAlerta();
                reservaPendiente = null;

            } catch (e) {
                console.error("Error al atender solicitud:", e);
            }
        }

        async function rechazarSolicitud() {
            if (!reservaPendiente) { cerrarAlerta(); return; }

            try {
                await _s.from('reservas_activas')
                    .update({ estado: 'rechazado' })
                    .eq('id', reservaPendiente.id);
            } catch (e) {}

            reservaPendiente = null;
            cerrarAlerta();
        }

            const seat = asientos[numSeat];

            if (!seat.ocupado) return;

            if (seat.idReserva) {
                await _s
                    .from('reservas_activas')
                    .update({ estado: 'finalizado' })
                    .eq('id', seat.idReserva);
            }

            asientos[numSeat] = {
