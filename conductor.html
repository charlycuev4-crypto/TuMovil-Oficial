<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Chofer - Tu Móvil</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- ESTILOS CSS UNIFICADOS -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; color: #fff; }

        #map-wrapper { 
            position: absolute; top: -30%; left: -30%; width: 160%; height: 160%; 
            z-index: 1; overflow: hidden; transform-origin: center center;
        }
        #map { width: 100%; height: 100%; }

        .top-nav {
            position: absolute; top: env(safe-area-inset-top, 12px); left: 12px; right: 12px;
            z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .header-bar {
            background: rgba(10, 10, 10, 0.88); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .connection-status { display: flex; align-items: center; gap: 8px; }
        #status-label { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #aaa; }

        .switch { position: relative; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 22px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background: #34c759; }
        input:checked + .slider:before { transform: translateX(22px); }

        .header-right-controls { display: flex; align-items: center; gap: 8px; }
        .recaudacion-flotante-box {
            background: rgba(10, 10, 10, 0.9); border: 1.5px solid #34c759; padding: 4px 10px;
            border-radius: 12px; display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: #34c759;
        }
        .speed-box-top {
            display: flex; align-items: center; justify-content: center; gap: 2px;
            background: #151515; border: 1.5px solid #00d2ff; padding: 4px 10px; border-radius: 12px;
        }
        .speed-box-top #txt-velocidad { font-size: 14px; font-weight: 900; color: #fff; }
        .speed-box-top .speed-unit { font-size: 8px; color: #00d2ff; font-weight: 800; }
        #btn-sentido { background: #ffcc00; border: none; padding: 6px 12px; border-radius: 12px; font-weight: 800; font-size: 10px; color: #000; cursor: pointer; }

        #panel-anuncio-parada {
            background: linear-gradient(135deg, rgba(10,25,50,0.92) 0%, rgba(5,10,20,0.95) 100%);
            backdrop-filter: blur(20px); border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 10px 14px; border-radius: 18px; display: none; pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4); text-align: left;
        }
        #panel-anuncio-parada.visible { display: block; }
        .anuncio-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .anuncio-titulo { color: #00d2ff; font-size: 9px; font-weight: 800; letter-spacing: 1.5px; }
        #anuncio-parada-distancia { color: #fff; background: rgba(0,210,255,0.2); padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; }
        .anuncio-nombre { font-size: 15px; font-weight: 800; color: #fff; margin-top: 1px; }

        .hud-paradas { display: flex; gap: 4px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; pointer-events: auto; }
        .hud-paradas::-webkit-scrollbar { display: none; }
        .parada-pill {
            padding: 4px 8px; border-radius: 8px; font-size: 9px; font-weight: 700; background: rgba(0,0,0,0.6);
            color: #777; border: 1px solid rgba(255,255,255,0.05); white-space: nowrap;
        }
        .parada-pill.proxima { background: #00d2ff; color: #000; font-weight: 800; }
        .parada-pill.visitada { background: rgba(52, 199, 89, 0.2); color: #34c759; }

        .wakelock-indicator { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: #34c759; color: #000; padding: 2px 8px; border-radius: 8px; font-size: 8px; font-weight: 800; display: none; z-index: 1001; }
        .wakelock-indicator.activo { display: block; }

        #btn-abrir-sheet {
            position: absolute; bottom: 82px; right: 16px; z-index: 999;
            background: #ffcc00; color: #000; border: none; width: 52px; height: 52px;
            border-radius: 50%; font-size: 22px; font-weight: bold; display: flex;
            align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; pointer-events: auto;
        }

        .bar-asientos-fija {
            position: absolute; bottom: env(safe-area-inset-bottom, 12px); left: 12px; right: 12px; z-index: 998;
            background: rgba(12, 12, 12, 0.92); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 8px; display: flex; gap: 6px; pointer-events: auto;
        }
        .pill {
            flex: 1; height: 50px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 800; color: #888; cursor: pointer; padding: 2px;
        }
        .pill .seat-num { font-size: 13px; color: #777; }
        .pill .nombre-pax { font-size: 9px; color: #fff; font-weight: 700; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pill .destino-pax { font-size: 8px; color: #ffcc00; font-weight: 600; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pill.active { background: rgba(255, 204, 0, 0.15); border-color: #ffcc00; }
        .pill.a-bordo { background: linear-gradient(135deg, #00d2ff, #0088cc); border-color: #00d2ff; }
        .pill.a-bordo .seat-num, .pill.a-bordo .nombre-pax { color: #000; }

        .bottom-sheet {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 1001;
            background: rgba(15, 15, 15, 0.98); backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.15); border-radius: 28px 28px 0 0;
            padding: 12px 16px env(safe-area-inset-bottom, 20px) 16px; max-height: 80vh; overflow-y: auto;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); pointer-events: auto;
        }
        .bottom-sheet.expanded { transform: translateY(0%); }
        .drag-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px; margin: 0 auto 12px auto; cursor: pointer; }

        .sheet-stats-grid { display: flex; gap: 10px; margin-bottom: 12px; }
        .q-stat { background: rgba(255,255,255,0.04); padding: 10px; border-radius: 16px; flex: 1; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .q-label { font-size: 9px; color: #888; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .q-value { font-size: 22px; font-weight: 900; margin-top: 2px; }

        .action-group { display: flex; flex-direction: column; gap: 8px; }
        .btn-action { width: 100%; border: none; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 14px; cursor: pointer; display: none; }
        .btn-subir-abordo { background: #00d2ff; color: #000; }
        .btn-llego-destino { background: #34c759; color: #fff; }
        .btn-vaciar { background: rgba(255, 59, 48, 0.05); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.2); display: block; padding: 10px; font-size: 12px; margin-top: 4px; }
        .btn-finalizar-jornada { display: block !important; background: linear-gradient(135deg, #bd2113 0%, #7a0f05 100%); color: #fff; margin-top: 8px; }

        .alerta-reserva { position: fixed; top: 0; left: 0; right: 0; background: #ff3b30; color: white; padding: 18px; text-align: center; z-index: 10000; transform: translateY(-100%); transition: transform 0.4s; }
        .alerta-reserva.mostrar { transform: translateY(0); }
        .btn-atender { background: white; color: #ff3b30; border: none; padding: 8px 24px; border-radius: 12px; font-weight: 800; margin-top: 8px; cursor: pointer; }

        .toast-container { position: fixed; top: 120px; left: 50%; transform: translateX(-50%); z-index: 10001; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
        .toast { background: rgba(10,10,10,0.95); color: white; padding: 10px 16px; border-radius: 12px; font-size: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); }
        .toast.success { border-color: #34c759; color: #34c759; }
        .toast.warning { border-color: #ffcc00; color: #ffcc00; }
        .toast.error { border-color: #ff3b30; color: #ff3b30; }

        .leaflet-tooltip.etiqueta-baja { background: #fff !important; color: #000 !important; border: 2px solid #00d2ff !important; font-weight: 800 !important; font-size: 11px !important; border-radius: 8px !important; }
        .leaflet-tooltip.etiqueta-sube { background: #ffcc00 !important; color: #000 !important; border: 2px solid #ff3b30 !important; font-weight: 800 !important; font-size: 11px !important; border-radius: 8px !important; }

        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.95); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 20px;
        }
        .login-card {
            background: #151515; border: 1px solid rgba(0, 210, 255, 0.3);
            width: 100%; max-width: 380px; padding: 24px; border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center;
        }
        .login-card h2 { color: #00d2ff; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
        .login-card p { color: #888; font-size: 12px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; color: #aaa; margin-bottom: 4px; }
        .form-group input {
            width: 100%; background: #0a0a0a; border: 1px solid #333; padding: 12px;
            border-radius: 12px; color: #fff; font-size: 14px; outline: none;
        }
        .form-group input:focus { border-color: #00d2ff; }
        .btn-ingresar {
            width: 100%; background: #00d2ff; color: #000; border: none; padding: 14px;
            border-radius: 14px; font-weight: 900; font-size: 15px; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-card">
            <h2>🚗 Tu Móvil - Ingreso Chofer</h2>
            <p>Configura los datos de tu vehículo para empezar a recibir pasajeros.</p>
            
            <div class="form-group">
                <label>Tu Nombre y Apellido</label>
                <input type="text" id="input-nombre" placeholder="Ej: Carlos Cuevas" />
            </div>
            
            <div class="form-group">
                <label>Patente / Dominio</label>
                <input type="text" id="input-patente" placeholder="Ej: JCP 478" />
            </div>
            
            <div class="form-group">
                <label>Modelo y Color del Auto</label>
                <input type="text" id="input-auto" placeholder="Ej: Ford Fiesta Negro" />
            </div>

            <button class="btn-ingresar" onclick="guardarDatosChofer()">Comenzar a Trabajar</button>
        </div>
    </div>

    <!-- Indicador de WakeLock -->
    <div id="wakelock-indicator" class="wakelock-indicator">PANTALLA ACTIVA</div>

    <!-- Alerta Flotante de Reservas -->
    <div id="alerta-reserva" class="alerta-reserva">
        <h2>¡NUEVA RESERVA!</h2>
        <p id="alerta-texto">Asiento asignado</p>
        <button class="btn-atender" onclick="cerrarAlerta()">ENTENDIDO</button>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- Controles Superiores -->
    <div class="top-nav">
        <div class="header-bar">
            <div class="connection-status">
                <label class="switch">
                    <input type="checkbox" id="online-toggle" onchange="gestionarConexion()">
                    <span class="slider"></span>
                </label>
                <span id="status-label">DESCONECTADO</span>
            </div>

            <div class="header-right-controls">
                <div class="recaudacion-flotante-box">
                    <span>💵</span> <span id="txt-plata">$0</span>
                </div>
                <div class="speed-box-top">
                    <span id="txt-velocidad">0</span>
                    <span class="speed-unit">KM/H</span>
                </div>
                <button id="btn-sentido" onclick="cambiarSentido()">IDA</button>
            </div>
        </div>

        <div id="panel-anuncio-parada">
            <div class="anuncio-header">
                <span class="anuncio-titulo">PRÓXIMA PARADA</span>
                <span id="anuncio-parada-distancia">0 m</span>
            </div>
            <div id="anuncio-parada-nombre" class="anuncio-nombre">Buscando ubicación...</div>
        </div>

        <div id="hud-paradas" class="hud-paradas"></div>
    </div>

    <!-- Mapa -->
    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <button id="btn-abrir-sheet" onclick="abrirSheet()">☰</button>

    <!-- Asientos Abajo -->
    <div class="bar-asientos-fija">
        <div id="pill1" class="pill" onclick="liberarAsiento(1)">
            <span class="seat-num">1</span>
            <span id="nombre-pax-1" class="nombre-pax">Libre</span>
            <span id="destino-pax-1" class="destino-pax">-</span>
        </div>
        <div id="pill2" class="pill" onclick="liberarAsiento(2)">
            <span class="seat-num">2</span>
            <span id="nombre-pax-2" class="nombre-pax">Libre</span>
            <span id="destino-pax-2" class="destino-pax">-</span>
        </div>
        <div id="pill3" class="pill" onclick="liberarAsiento(3)">
            <span class="seat-num">3</span>
            <span id="nombre-pax-3" class="nombre-pax">Libre</span>
            <span id="destino-pax-3" class="destino-pax">-</span>
        </div>
        <div id="pill4" class="pill" onclick="liberarAsiento(4)">
            <span class="seat-num">4</span>
            <span id="nombre-pax-4" class="nombre-pax">Libre</span>
            <span id="destino-pax-4" class="destino-pax">-</span>
        </div>
    </div>

    <!-- Panel Inferior -->
    <div id="driver-sheet" class="bottom-sheet">
        <div class="drag-handle" onclick="cerrarSheet()"></div>

        <div class="sheet-stats-grid">
            <div class="q-stat">
                <div class="q-label">Pasajeros</div>
                <div id="txt-pax" class="q-value">0</div>
            </div>
            <div class="q-stat">
                <div class="q-label">Ubicación</div>
                <div id="txt-parada" class="q-value" style="font-size: 13px; font-weight: 800; margin-top: 6px;">-</div>
            </div>
        </div>

        <div class="action-group">
            <button id="btn-subir-abordo" class="btn-action btn-subir-abordo" onclick="marcarPasajeroABordo()">👤 Pasajeros a Bordo</button>
            <button id="btn-llego-destino" class="btn-action btn-llego-destino" onclick="llegoADestino()">🏁 Llegó a Destino</button>
            <button class="btn-action btn-vaciar" onclick="confirmarVaciar()">🧹 Vaciar Todos los Asientos</button>
            <button class="btn-action btn-finalizar-jornada" onclick="finalizarJornada()">🔴 Finalizar Jornada Laboral</button>
        </div>
    </div>

    <!-- Scripts CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- LÓGICA DE JAVASCRIPT INTEGRADA Y BLINDADA -->
    <script>
        const TARIFA_UNICA = 1500;
        const _s = supabase.createClient('https://nvumdlxervrewqiiaicl.supabase.co', 'sb_publishable_oVmiLSfe_AJ5iDpeAXIukA_CLdHuwkE');

        let MI_ID_MOVIL = localStorage.getItem('driver_id_movil');
        let MI_NOMBRE = localStorage.getItem('driver_nombre_completo');

        const paradas = [
            { n: 'Av. Derqui y P197 (Cruce Derqui)', c: [-34.537898, -58.794848] },
            { n: 'Fray Antonio Marchena y Carlos Eberth', c: [-34.539274, -58.793441] },

            { n: 'Los Aromos y Murillo', c: [-34.564006, -58.773679] },
            { n: 'Murillo y Moctezuma', c: [-34.565289, -58.772213] },
            { n: 'Murillo y Güiraldes', c: [-34.567268, -58.769484] },
            { n: 'Murillo y Watt', c: [-34.569090, -58.767095] },
            { n: 'A. Prado 2555', c: [-34.571016, -58.764443] },
            { n: 'Prado y Payró', c: [-34.571956, -58.763201] },
            { n: 'Prado 1744', c: [-34.577371, -58.755909] },
            { n: 'Boulevard Caveri', c: [-34.578528, -58.757064] },
            { n: 'Caveri y Azara', c: [-34.579296, -58.755864] },

            { n: 'Caveri y Tablada', c: [-34.580901, -58.753842] },

            { n: 'Maternidad', c: [-34.588244, -58.749877] },

        ];

        let map, markerCoche, rutaLine, rastroPolyline;
        let estaOnline = false, watchId = null, sentidoActual = 'IDA';
        let ultimaVezEnviado = 0, ultimaCantidadReservas = 0;
        let wakeLock = null, audioContext = null;
        let historialParadas = [], direccionDetectada = 'IDA', historialPosiciones = [], anguloActual = 0, velocidadActual = 0, puntosRastro = [];
        const MAX_PUNTOS_RASTRO = 80;
        let markersPax = [], markersDest = [];

        function crearIconoAuto(angulo, velocidad) {
            const colorVelocidad = velocidad > 50 ? '#ff3b30' : velocidad > 30 ? '#ffcc00' : '#00d2ff';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="44" height="58">
                <defs>
                    <radialGradient id="radarG" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:${colorVelocidad};stop-opacity:0.5"/>
                        <stop offset="100%" style="stop-color:${colorVelocidad};stop-opacity:0"/>
                    </radialGradient>
                    <linearGradient id="carG" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFD700"/><stop offset="100%" style="stop-color:#E6B800"/>
                    </linearGradient>
                </defs>
                <circle cx="60" cy="80" r="35" fill="url(#radarG)" opacity="0.4">
                    <animate attributeName="r" values="25;45;25" dur="2s" repeatCount="indefinite"/>
                </circle>
                <g>
                    <rect x="22" y="28" width="76" height="92" rx="18" fill="url(#carG)" stroke="#1a1a1a" stroke-width="2.5"/>
                    <rect x="30" y="46" width="60" height="56" rx="10" fill="#fff" opacity="0.2"/>
                    <polygon points="60,8 46,26 74,26" fill="${colorVelocidad}" stroke="#1a1a1a" stroke-width="1.5"/>
                </g>
            </svg>`;
            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        window.addEventListener('DOMContentLoaded', () => {
            map = L.map('map', { zoomControl: false, rotate: true }).setView(paradas[0].c, 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { keepBuffer: 8 }).addTo(map);

            rutaLine = L.polyline(paradas.map(p => p.c), { color: '#ff3b30', weight: 6, opacity: 0.6 }).addTo(map);

            paradas.forEach((p, i) => {
                L.circleMarker(p.c, { radius: 5, color: '#000', weight: 2, fillColor: '#00BFFF', fillOpacity: 0.9 })
                    .addTo(map).bindTooltip((i + 1) + ". " + p.n, { permanent: false, direction: 'top' });
            });

            rastroPolyline = L.polyline([], { color: '#00d2ff', weight: 4, opacity: 0.5, dashArray: '6, 4' }).addTo(map);

            let miIcono = L.icon({ iconUrl: crearIconoAuto(0, 0), iconSize: [44, 58], iconAnchor: [22, 29], className: 'auto-radar-icon' });
            markerCoche = L.marker(paradas[0].c, { icon: miIcono, zIndexOffset: 1000 }).addTo(map);

            if (!MI_ID_MOVIL || !MI_NOMBRE) {
                const overlay = document.getElementById('login-overlay');
                if (overlay) overlay.style.display = 'flex';
            } else {
                const overlay = document.getElementById('login-overlay');
                if (overlay) overlay.style.display = 'none';
                iniciarJornadaBase();
            }
        });

        async function guardarDatosChofer() {
            const nombre = document.getElementById('input-nombre').value.trim();
            const patente = document.getElementById('input-patente').value.trim();
            const auto = document.getElementById('input-auto').value.trim();

            if (!nombre || !patente || !auto) {
                alert('Por favor complete todos los campos.');
                return;
            }

            MI_NOMBRE = `${nombre} - ${auto} (${patente})`;
            MI_ID_MOVIL = Math.floor(Math.random() * 90000) + 1000; 

            localStorage.setItem('driver_id_movil', MI_ID_MOVIL);
            localStorage.setItem('driver_nombre_completo', MI_NOMBRE);

            try {
                await _s.from('estado_movil').upsert({
                    id: MI_ID_MOVIL,
                    chofer: MI_NOMBRE,
                    esta_online: false,
                    sentido_flujo: 'IDA'
                });
            } catch(e) { console.warn("Supabase sync:", e); }

            const overlay = document.getElementById('login-overlay');
            if (overlay) overlay.style.display = 'none';

            location.reload();
        }

        function iniciarJornadaBase() {
            const sentidoGuardado = localStorage.getItem('driver_sentido');
            if (sentidoGuardado) {
                sentidoActual = sentidoGuardado;
                direccionDetectada = sentidoGuardado;
                const btnSentido = document.getElementById('btn-sentido');
                if (btnSentido) btnSentido.innerText = sentidoActual;
                if (rutaLine) rutaLine.setStyle({ color: sentidoActual === 'IDA' ? '#ff3b30' : '#007aff' });
            }

            const onlineGuardado = localStorage.getItem('driver_online');
            if (onlineGuardado === 'true') {
                const toggle = document.getElementById('online-toggle');
                if (toggle) toggle.checked = true;
                gestionarConexion();
            }

            setInterval(actualizar, 4000);
        }

        function abrirSheet() { document.getElementById('driver-sheet').classList.add('expanded'); }
        function cerrarSheet() { document.getElementById('driver-sheet').classList.remove('expanded'); }
        
        function mostrarToast(mensaje, tipo) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast ' + tipo;
            toast.textContent = mensaje;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function gestionarConexion() {
            const toggle = document.getElementById('online-toggle');
            const label = document.getElementById('status-label');
            estaOnline = toggle ? toggle.checked : false;
            localStorage.setItem('driver_online', estaOnline ? 'true' : 'false');

            if (estaOnline) {
                if (label) { label.innerText = "CONECTANDO..."; label.style.color = "#ffcc00"; }
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude, lon = pos.coords.longitude;
                    await _s.from('estado_movil').update({ 
                        esta_online: true, latitud: lat, longitud: lon, 
                        sentido_flujo: sentidoActual, chofer: MI_NOMBRE 
                    }).eq('id', MI_ID_MOVIL);
                    if (label) { label.innerText = "EN LÍNEA"; label.style.color = "#34c759"; }
                    iniciarGPS();
                    cerrarSheet();
                }, () => { 
                    if (toggle) toggle.checked = false; 
                    if (label) { label.innerText = "ERROR GPS"; label.style.color = "#ff3b30"; }
                }, { enableHighAccuracy: true });
            } else {
                if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
                await _s.from('estado_movil').update({ esta_online: false }).eq('id', MI_ID_MOVIL);
                if (label) { label.innerText = "DESCONECTADO"; label.style.color = "#aaa"; }
            }
        }

        function iniciarGPS() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(async (p) => {
                const lat = p.coords.latitude, lon = p.coords.longitude;
                velocidadActual = Math.round((p.coords.speed || 0) * 3.6);
                const txtVel = document.getElementById('txt-velocidad');
                if (txtVel) txtVel.textContent = velocidadActual;
                
                if (markerCoche) markerCoche.setLatLng([lat, lon]);
                if (map) map.panTo([lat, lon]);

                const txtParada = document.getElementById('txt-parada');
                if (txtParada) txtParada.innerText = "En movimiento";
            }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 4000 });
        }

        async function actualizar() {
            if (!MI_ID_MOVIL) return;
            try {
                const { data: reservas } = await _s.from('reservas_activas').select('*').eq('id_movil', MI_ID_MOVIL).eq('estado', 'en_curso');
                if (reservas) {
                    const txtPax = document.getElementById('txt-pax');
                    const txtPlata = document.getElementById('txt-plata');
                    if (txtPax) txtPax.innerText = reservas.length;
                    if (txtPlata) txtPlata.innerText = "$" + (reservas.length * TARIFA_UNICA);
                }
            } catch (err) { console.error("Error polling:", err); }
        }

        async function cambiarSentido() {
            sentidoActual = (sentidoActual === 'IDA') ? 'VUELTA' : 'IDA';
            localStorage.setItem('driver_sentido', sentidoActual);
            document.getElementById('btn-sentido').innerText = sentidoActual;
            if (estaOnline) { await _s.from('estado_movil').update({ sentido_flujo: sentidoActual }).eq('id', MI_ID_MOVIL); }
        }

        async function liberarAsiento(n) {
            if (confirm('¿Liberar asiento ' + n + '?')) {
                await _s.rpc('finalizar_asiento_individual', { p_id_movil: MI_ID_MOVIL, p_asiento: n });
                actualizar();
            }
        }

        async function finalizarJornada() {
            if (!confirm("🏁 ¿Finalizar jornada?")) return;
            if (watchId) navigator.geolocation.clearWatch(watchId);
            await _s.from('estado_movil').update({ esta_online: false }).eq('id', MI_ID_MOVIL);
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
