<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tu Móvil - Cargando</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-color: #05070a; overflow: hidden; font-family: sans-serif;
        }
        .splash-container {
            width: 100%; height: 100%; position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .splash-image {
            width: 100%; max-height: 80vh; object-fit: contain;
        }
        /* Contenedor de la barra de carga futurista */
        .loader-bar-container {
            width: 80%; max-width: 300px; height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px; margin-top: 20px; overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
        /* Relleno verde que avanza */
        .loader-bar-fill {
            width: 0%; height: 100%;
            background: #39ff14;
            box-shadow: 0 0 10px #39ff14;
            transition: width 0.1s linear;
        }
        .loader-text {
            color: #fff; font-size: 13px; font-weight: bold; margin-top: 10px;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <!-- Reemplaza "tu-imagen.jpg" con el nombre o enlace de tu imagen base -->
        <img src="tu-imagen.jpg" alt="Tu Móvil" class="splash-image">
        
        <!-- Barra de carga animada -->
        <div class="loader-bar-container">
            <div id="bar-fill" class="loader-bar-fill"></div>
        </div>
        <div id="loader-text" class="loader-text">Cargando... 0%</div>
    </div>

    <script>
        const barra = document.getElementById('bar-fill');
        const texto = document.getElementById('loader-text');
        let progreso = 0;

        // El tiempo total es de 5000ms (5 segundos)
        const duracionTotal = 5000; 
        const intervaloTiempo = 50; // Cada cuánto se actualiza (ms)
        const incrementoPorPaso = (100 / (duracionTotal / intervaloTiempo));

        const timer = setInterval(() => {
            progreso += incrementoPorPaso;
            if (progreso >= 100) {
                progreso = 100;
                clearInterval(timer);
            }
            
            // Actualiza el ancho de la barra y el texto del porcentaje
            barra.style.width = progreso + '%';
            texto.innerText = `Cargando... ${Math.round(progreso)}%`;
        }, intervaloTiempo);

        // Redirección exacta a los 5 segundos
        setTimeout(() => {
            window.location.href = 'conductor.html'; // Cambia por tu archivo principal
        }, duracionTotal);
    </script>
</body>
</html>
